<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIX</title><script src="https://sdk.minepi.com/pi-sdk.js"></script></head><body style="padding:20px;font-family:Arial">
<h2>Fix Loop - Tap TESTNET first</h2>
<button onclick="setTest()" style="background:orange;padding:15px;width:100%;font-weight:bold">1️⃣ FIRST: Set TESTNET & Auth</button>
<pre id="log" style="background:#eee;padding:15px;margin-top:15px;min-height:200px;white-space:pre-wrap;border:2px solid red">Ready. Open in Pi Browser.</pre>
<button onclick="manualComplete()" style="background:green;color:white;padding:20px;width:100%;font-weight:bold;margin-top:10px">2️⃣ TAP TO MANUALLY COMPLETE fvZP7b...</button>
<script>
let lastPayment=null;
function setTest(){
 const log=document.getElementById('log');
 Pi.init({version:"2.0",sandbox:true});
 log.innerText='Sandbox TESTNET init - Authenticating...';
 Pi.authenticate(['username','payments'], async(p)=>{
  lastPayment=p;
  log.innerText='FOUND STUCK PAYMENT:\nID: '+p.identifier+'\nTxID: '+(p.transaction?p.transaction.txid:'NO TXID')+'\nAmount: '+p.amount+'\n\nNow tap button 2 to complete it!';
 }).then(u=>{log.innerText+='\n\nAuth as: '+u.user.username;}).catch(e=>{log.innerText='Auth error: '+e.message});
}
async function manualComplete(){
 const log=document.getElementById('log');
 if(!lastPayment){log.innerText='Tap button 1 first!';return;}
 const pid=lastPayment.identifier;
 const txid=lastPayment.transaction ? lastPayment.transaction.txid : null;
 if(!txid){log.innerText='No txid - cannot complete, trying cancel...'; 
   const r=await fetch('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid})});
   const j=await r.json(); log.innerText=JSON.stringify(j,null,2); return;
 }
 log.innerText='Completing...\nID: '+pid+'\nTxID: '+txid;
 const r=await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid,txid:txid})});
 const j=await r.json();
 log.innerText='SERVER RESULT:\n'+JSON.stringify(j,null,2)+'\n\nIf success: CLOSE Pi Browser NOW (swipe away) and reopen.';
}
</script>
</body></html>
