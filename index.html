<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revealed Logistics - SCANIA Fleet</title>
<style>
body{font-family:Arial;margin:0;background:#eef2ff}
header{background:#0a3cc9;color:white;padding:22px;text-align:center}
header h1{margin:0;font-size:30px}
.grid{display:grid;grid-template-columns:1fr;gap:14px;padding:14px;max-width:1200px;margin:auto}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.card img{width:100%;height:240px;object-fit:cover;display:block}
.info{padding:14px}.card h3{margin:0;color:#0a3cc9}
.btn{background:#0a3cc9;color:white;border:none;padding:12px;width:100%;border-radius:10px;font-weight:bold;margin-top:10px}
</style></head><body>
<header><h1>REVEALED LOGISTICS</h1><p>SCANIA Fleet • Delivering With Precision</p></header>
<div class="grid">
<div class="card"><img src="./fuel-tanker.jpg"><div class="info"><h3>SCANIA Fuel Tanker 35,000L</h3><button class="btn">Book Fuel Tanker</button></div></div>
<div class="card"><img src="./lowbed.jpg"><div class="info"><h3>SCANIA Lowbed 60T</h3><button class="btn">Book Lowbed</button></div></div>
<div class="card"><img src="./reefer.jpg"><div class="info"><h3>SCANIA Reefer - Cold Chain</h3><button class="btn">Book Reefer</button></div></div>
<div class="card"><img src="./tautliner.jpg"><div class="info"><h3>SCANIA Tautliner Superlink</h3><button class="btn">Book Tautliner</button></div></div>
<div class="card"><img src="./tipper.jpg"><div class="info"><h3>SCANIA Tipper</h3><button class="btn">Book Tipper</button></div></div>
<div class="card"><img src="./van.jpg"><div class="info"><h3>SCANIA Van - Last Mile</h3><button class="btn">Book Van</button></div></div>
</div></body></html>
