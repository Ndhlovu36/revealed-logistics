<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Revealed Logistics | Fixed Names</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f5f7fb}
.header{background:#0a1931;color:#fff;padding:15px 20px;text-align:center}
.logo{color:#ffcc00;font-weight:900;font-size:20px}
.hero{background:#0a1931;color:#fff;text-align:center;padding:40px 20px}
.hero span{color:#ffcc00}
.fleet{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:15px;max-width:1200px;margin:auto}
@media(min-width:800px){.fleet{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.1);position:relative}
.card img{width:100%;height:165px;object-fit:cover}
.card-body{padding:10px}.badge{position:absolute;top:8px;left:8px;background:#ffcc00;font-size:10px;font-weight:900;padding:3px 8px;border-radius:20px}
</style>
</head>
<body>
<div class="header"><div class="logo">REVEALED LOGISTICS — 8 TRUCK TYPES</div></div>
<div class="hero"><h1>WE OPERATE <span>8 TRUCK TYPES</span></h1><p>Fixed & Rearranged</p></div>
<div id="fleet" class="fleet">Loading & fixing names...</div>
<script>
async function load(){
  const res = await fetch('https://api.github.com/repos/Ndhlovu36/revealed-logistics/contents?ref=main');
  const files = await res.json();
  let imgs = files.filter(f=>f.name.toLowerCase().startsWith('img-')).map(f=>f.name).sort();
  // Remove duplicate - keep 8 only, remove one of the blue side tipper duplicates (index 6)
  if(imgs.length>8){ imgs.splice(6,1); }
  // CORRECTED mapping - matches what you actually uploaded:
  const correct = [
    {title:"Abnormal Load / Lowbed Heavy Haul", desc:"Mining Machines - CAT Excavator", badge:"TYPE 07"},
    {title:"Fuel Tanker", desc:"Diesel 50k L - Dangerous Goods", badge:"TYPE 02"},
    {title:"Refrigerated - Fridge", desc:"-25°C Cold Chain", badge:"TYPE 03"},
    {title:"Flat Deck / Lowbed", desc:"Steel & Timber - Excavators", badge:"TYPE 06"},
    {title:"Side Tipper - Blue Scania", desc:"Chrome Ore - Blue Fleet", badge:"TYPE 01"},
    {title:"End Tipper", desc:"Coal & Aggregate - White Tipper Fleet", badge:"TYPE 04"},
    {title:"Tautliner", desc:"General Cargo - Curtain Side", badge:"TYPE 05"},
    {title:"Delivery Vans", desc:"Last Mile JHB - Small Fleet", badge:"TYPE 08"}
  ];
  const container=document.getElementById('fleet');
  container.innerHTML='';
  imgs.forEach((name,i)=>{
    const c = correct[i] || {title:"Fleet "+(i+1),desc:"",badge:"TYPE 0"+(i+1)};
    container.innerHTML+=`<div class="card"><span class="badge">${c.badge}</span><img src="${name}"><div class="card-body"><h3 style="font-size:13px;color:#0a1931">${c.title}</h3><p style="font-size:11px;color:#666">${c.desc}</p></div></div>`;
  });
}
load();
</script>
</body>
</html>
