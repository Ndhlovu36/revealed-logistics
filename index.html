<script>
let user=null,mode='test',isPaying=false;
function setMode(m){mode=m;document.getElementById('t-test').className=m=='test'?'tab active':'tab';document.getElementById('t-main').className=m=='main'?'tab main active':'tab main';Pi.init({version:"2.0",sandbox:m=='test'});}
setMode('test');
async function login(){let b=document.getElementById('loginBtn');b.innerText='...';try{let a=await Pi.authenticate(['username','payments'],()=>{});user=a.user;b.innerText='✓ '+a.user.username;}catch(e){b.innerText='Login Pi';}}
async function pay(){if(isPaying)return;if(!user){alert('Login Pi');return;}let amt=parseFloat(document.getElementById('fleet').value);let ft=document.getElementById('fleet').options[document.getElementById('fleet').selectedIndex].text;let from=document.getElementById('from').value;let to=document.getElementById('to').value;isPaying=true;let btn=document.getElementById('payBtn');btn.innerText='Processing...';btn.disabled=true;try{await Pi.createPayment({amount:amt,memo:`Revealed ${from}->${to} ${ft}`,metadata:{fleet:ft,from,to}},{
onReadyForServerApproval:async(pid)=>{let r=await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid})});if(!r.ok)throw new Error('Add PI_API_KEY in Vercel');},
onReadyForServerCompletion:async(pid,txid)=>{await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid,txid})});document.getElementById('status').innerText=`✅ BOOKED! ${from} -> ${to}\n${ft}\nTX:${txid}`;btn.innerText='✅ BOOKED!';btn.disabled=false;isPaying=false;},
onCancel:()=>{btn.innerText='Book WA0397';btn.disabled=false;isPaying=false;},
onError:(e)=>{document.getElementById('status').innerText='❌ '+e.message;btn.innerText='Retry';btn.disabled=false;isPaying=false;}
});}catch(e){document.getElementById('status').innerText='❌ '+e.message;btn.innerText='Retry';btn.disabled=false;isPaying=false;}}
</script></body></html>
