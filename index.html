<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:Arial;margin:0;background:#f0f2f5}

.net{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.net button{padding:7px 14px;border-radius:20px;border:2px solid #ffcc00;background:transparent;color:#fff;font-weight:bold}
.net button.active{background:#ffcc00;color:#001a4d}
.quote{background:#fff;margin:14px;padding:16px;border-radius:14px}

#piStatus{color:#ffcc00;font-weight:bold}

<body>
<header>
<h2>REVEALED LOGISTICS</h2>
<div id="piStatus">Pi Network - Not Logged In</div>
<div class="net">
<button id="bMain" class="active" onclick="setNet('mainnet')">MAINNET</button>
<button id="bTest" onclick="setNet('testnet')">TESTNET</button>
<button onclick="loginWithPi()" style="background:#ffcc00;color:#001a4d;border:none;padding:7px 14px;border-radius:20px;font-weight:bold">🔐 Login Pi</button>
</div>
</header>
<div class="hero">19 TRUCKS | π0.2 per 100km | PRICE FLUCTUATES BY DISTANCE</div>
<div class="grid" id="fleetGrid"></div>

<div class="quote">
<h3>Distance Calculator - 91 Cities - π0.2 /100km</h3>
<input id="pickupPoint" list="cityList" placeholder="Pickup e.g. Bloemfontein">
<input id="dropPoint" list="cityList" placeholder="Drop e.g. Johannesburg">
<datalist id="cityList"></datalist>
<input id="collectDate" type="date">
<input id="piUser" placeholder="Pi Username">
<div id="calcRes">Tap ANY Hire button - All fixed</div>
<button class="btn" style="background:#ff8c00" onclick="payWithPi()">Pay with Pi - π0.2/100km</button>

function setNet(n){ currentNet=n; Pi.init({version:"2.0", sandbox: n==='testnet'}); document.getElementById('bMain').className=n==='mainnet'?'active':''; document.getElementById('bTest').className=n==='testnet'?'active':''; }

const dl=document.getElementById('cityList');
Object.keys(cities).forEach(c=>{ let o=document.createElement('option'); o.value=c.charAt(0).toUpperCase()+c.slice(1); dl.appendChild(o); });
function getLatLon(s){ s=s.toLowerCase().trim(); if(cities[s]) return cities[s]; for(let k in cities){ if(s.includes(k)||k.includes(s)) return cities[k]; } return null; }
function haversine(lat1,lon1,lat2,lon2){ const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }

function calcDist(){
 const pickup=document.getElementById('pickupPoint').value.trim();
 const drop=document.getElementById('dropPoint').value.trim();
 const date=document.getElementById('collectDate').value;
 if(!pickup||!drop||!selName){ document.getElementById('calcRes').innerHTML= selName? `Selected: ${selName} - Enter Pickup & Drop` : "Tap ANY Hire button"; return 0; }
 const p=getLatLon(pickup); const d=getLatLon(drop);
 if(p&&d){ distanceKm=Math.round(haversine(p[0],p[1],d[0],d[1])*1.32); } else { distanceKm=400; }
 let total = selPrice * distanceKm / 100;
 if(total<0.0001) total=0.0001;
 total=parseFloat(total.toFixed(4));
 document.getElementById('calcRes').innerHTML=`Truck: <b>${selName}</b><br>Route: ${pickup} → ${drop}<br>Distance: <b>${distanceKm} km</b><br>Rate: π ${selPrice}/100km<br><span style="font-size:22px;color:#ffcc00">TOTAL: π ${total}</span> (fluctuates by distance)<br>Date: ${date||'Not set'}`;
 return total;
}

const grid=document.getElementById('fleetGrid');
fleet.forEach((f,i)=>{
 const d=document.createElement('div'); d.className='card';
 d.innerHTML=`<img src="${f.file}?v=12" onerror="this.src='https://via.placeholder.com/400x220?text=${encodeURIComponent(f.name)}'"><div class="card-body"><b>${f.name}</b><br>π0.2/100km<br><button class="btn" data-i="${i}">Hire ${f.name}</button></div>`;
 grid.appendChild(d);
});
grid.addEventListener('click', e=>{ if(e.target.tagName==='BUTTON'){ hire(parseInt(e.target.getAttribute('data-i'))); } });
function hire(i){ let f=fleet[i]; selName=f.name; selPrice=f.price; selFile=f.file; document.getElementById('status').innerText="Selected: "+f.name+" ✅"; calcDist(); document.querySelector('.quote').scrollIntoView({behavior:'smooth'}); }
function status(t){ document.getElementById('status').innerText=t; }
document.getElementById('pickupPoint').addEventListener('input', calcDist);
document.getElementById('dropPoint').addEventListener('input', calcDist);
document.getElementById('collectDate').addEventListener('change', calcDist);

async function payWithPi(){
 const pickup=document.getElementById('pickupPoint').value;
 const drop=document.getElementById('dropPoint').value;
 const date=document.getElementById('collectDate').value;
 if(!selName){ alert('Tap Hire'); return; }
 if(!pickup||!drop){ alert('Enter Pickup & Drop'); return; }
 if(!date){ alert('Select Date'); return; }
 if(!user){ await loginWithPi(); if(!user) return; }
 const total=calcDist();
 status("Creating payment π "+total+"...");
 try{
  Pi.createPayment({amount: total, memo: `REVEALED ${selName} ${pickup}->${drop} ${date}`, metadata:{truck:selName, pickup, drop, date, distance:distanceKm, network:currentNet}},{
   onReadyForServerApproval:function(id){ status("Approving... "+id); fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})}).catch(()=>{}); },
   onReadyForServerCompletion:function(id,txid){ status(`✅ PAID π ${total} SUCCESS TX:${txid} - ${selName} ${distanceKm}km ${date}`); fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id, txid})}).catch(()=>{}); },
   onCancel:function(){ status("❌ Cancelled"); },
   onError:function(e){ status("❌ "+e.message); }
  });
 }catch(e){ status("❌ "+e.message); }
}
