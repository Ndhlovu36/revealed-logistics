<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REVEALED LOGISTICS</title>
<style>
body{background:#001a4d;color:white;font-family:Arial;text-align:center;padding:10px;margin:0}
.inp{width:90%;padding:12px;margin:6px;border-radius:8px;border:0}
.btn.btn-pi{background:gold;color:black;padding:14px;width:92%;border-radius:10px;font-weight:bold;font-size:16px;margin:8px;border:0}
.status{background:black;padding:10px;margin:8px;border-radius:8px}
</style>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
<div>
<h2>REVEALED LOGISTICS</h2>
<input id="pickup" class="inp" placeholder="Pickup - e.g. Johannesburg">
<input id="drop" class="inp" placeholder="Drop - e.g. Durban">
<select id="truck" class="inp">
<option>WA0397 Side Tipper</option>
<option>Flat Deck</option>
<option>Tautliner</option>
<option>Side Curtain</option>
<option>Panel Van</option>
<option>Abnormal Load</option>
<option>Fuel Tanker</option>
<option>Refrigerated Truck</option>
</select>
<input id="wa" class="inp" placeholder="WhatsApp number">
<button class="btn btn-pi" id="payBtn">Book & Pay with Pi</button>
<div id="status" class="status">✅ Pickup & Drop tabs live</div>
</div>
<script>
let user=null; let isPaying=false;
async function pay(){
if(isPaying) return;
let pickup=document.getElementById('pickup').value;
let drop=document.getElementById('drop').value;
if(!pickup||!drop){alert('Enter Pickup & Drop');return;}
isPaying=true;
let btn=document.getElementById('payBtn'); btn.innerText='Paying...';
try{
Pi.createPayment({amount:1,memo:'Revealed Logistics '+pickup+' to '+drop,metadata:{pickup:pickup,dropoff:drop}},{onReadyForServerApproval:async(pid)=>{await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid})})},onReadyForServerCompletion:async(pid,txid)=>{await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid,txid:txid})}); document.getElementById('status').innerText='✅ Paid!'; isPaying=false; btn.innerText='Book & Pay with Pi';},onCancel:()=>{btn.innerText='Book & Pay with Pi'; isPaying=false;},onError:(e)=>{document.getElementById('status').innerText='Error '+e; isPaying=false; btn.innerText='Book & Pay with Pi';}});
}catch(e){document.getElementById('status').innerText='Error '+e; isPaying=false; btn.innerText='Book & Pay with Pi';}
}
document.getElementById('payBtn').onclick=pay;
</script>
</body>
</html>
