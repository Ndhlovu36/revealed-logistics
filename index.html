<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REVEALED LOGISTICS - Pi Delivery</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:Arial; padding:20px; background:#f4f4f4}
.card{background:#fff; padding:20px; border-radius:12px; max-width:500px; margin:auto}
input, select, textarea{width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #ccc}
.btn{width:100%; padding:12px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:8px}
.btn-yellow{background:#ffeb3b} .btn-dark{background:#000; color:#fff}
footer{text-align:center; margin-top:20px; font-size:12px}
</style>
</head>
<body>

<div class="card">
<h2>Get Instant Quote</h2>
<p id="pi-user">Not logged in</p>
<button class="btn btn-yellow" onclick="loginWithPi()">Login with Pi</button>

<input type="text" id="from" placeholder="From - City">
<input type="text" id="to" placeholder="To - City">
<select id="type"><option>Parcel</option><option>Documents</option><option>Furniture</option></select>
<input type="text" id="weight" placeholder="Weight (kg)">
<input type="text" id="phone" placeholder="Phone Number">
<textarea rows="3" id="details" placeholder="Details"></textarea>

<button class="btn btn-dark" onclick="payWithPi(document.getElementById('type').value)">Get Quote for 1 Pi</button>
</div>

<footer>
<p>© 2026 REVEALED LOGISTICS | All Rights Reserved</p>
<p><a href="legal.html">Terms & Privacy</a></p>
<p>Email: revealedlogistics@gmail.com</p>
</footer>

<script>
const Pi = window.Pi;
Pi.init({ version: "2.0", sandbox: false });
let user = null;

function onIncomplete(p){ console.log("Incomplete payment:", p); }

async function loginWithPi(){
 try{
  const auth = await Pi.authenticate(['username','payments'], onIncomplete);
  user = auth.user;
  document.getElementById('pi-user').innerText = "Hi, "+user.username;
 }catch(e){
  alert("Login failed: "+e.message);
 }
}

async function payWithPi(serviceName){
 if(!user){ alert("Please Login with Pi first"); return; }
 const from = document.getElementById('from').value;
 const to = document.getElementById('to').value;
 if(!from || !to){ alert("Please enter From and To"); return; }

 try{
  await Pi.createPayment({
    amount: 1,
    memo: serviceName+" quote "+from+" to "+to,
    metadata: {service: serviceName, from: from, to: to}
  }, {
    onReadyForServerApproval: async (paymentId) => {
      console.log("Approving...", paymentId);
      await fetch('/api/approve', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({paymentId: paymentId})
      });
    },
    onReadyForServerCompletion: async (paymentId, txid) => {
      console.log("Completing...", paymentId, txid);
      await fetch('/api/complete', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({paymentId: paymentId, txid: txid})
      });
      alert("Payment Success! We will contact you for quote.");
    },
    onCancel: (id)=>{ console.log("Cancelled", id); },
    onError: (e)=>{ alert("Pi Error: "+e.message); }
  });
 }catch(e){
  alert("Payment error: "+e.message);
 }
}
</script>
</body>
</html>
