<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Revealed Logistics | 8 Trucks Pi Payments</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef4ff;color:#0a1931}
.header{background:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.logo{font-weight:900;color:#0052cc;line-height:1.1;font-size:16px}
.logo span{color:#0a1931}
.switch{display:flex;gap:4px;background:#eee;padding:3px;border-radius:20px}
.switch button{padding:6px 12px;border-radius:15px;border:none;font-size:10px;font-weight:900;cursor:pointer;transition:.2s}
.switch button.active{background:#0052cc;color:#fff}
.switch button.test-active{background:#ff4444;color:#fff}
.mode-banner{text-align:center;padding:8px;font-size:11px;font-weight:900;color:#fff;letter-spacing:.5px}
.mode-main{background:#6a1bbf}
.mode-test{background:#ff4444}
.btn{padding:10px 14px;border-radius:20px;border:none;font-weight:900;cursor:pointer;font-size:11px;background:#0052cc;color:#fff;width:100%}
.btn:active{transform:scale(.97)}
.section{max-width:1200px;margin:auto;padding:14px 12px}
.fleet{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:900px){.fleet{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08);position:relative;cursor:pointer;border:2px solid transparent;transition:.2s}
.card.selected{border-color:#0052cc;box-shadow:0 0 0 3px rgba(0,82,204,.25)}
.card img{width:100%;height:150px;object-fit:cover;background:#ddd;display:block}
.badge{position:absolute;top:7px;left:7px;background:#ffcc00;color:#0a1931;padding:4px 8px;border-radius:12px;font-size:8px;font-weight:900}
.card-body{padding:8px}
.card-body h3{font-size:11px;line-height:1.2;color:#0a1931}
.card-body p{font-size:9px;color:#666;margin-top:2px}
.box{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.06);margin-bottom:12px}
.inp{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font-size:13px;outline:none}
.inp:focus{border-color:#0052cc}
label{font-size:10px;font-weight:900;color:#0052cc;display:block;margin-top:6px}
.pi-status{font-size:11px;margin-top:8px;padding:10px;border-radius:8px;background:#f0f0f0;word-break:break-all;line-height:1.3}
</style>
</head>
<body>

<div id="modeBanner" class="mode-banner mode-main">MODE: MAINNET Pi - Real Payments Live</div>

<div class="header">
<div class="logo">REVEALED<br><span>LOGISTICS</span></div>
<div style="display:flex;gap:8px;align-items:center">
<div class="switch">
<button id="btnMain" class="active" onclick="setMode(false)">MAINNET</button>
<button id="btnTest" onclick="setMode(true)">TESTNET</button>
</div>
<button class="btn" id="loginBtn" style="width:auto;padding:8px 14px" onclick="piLogin()">π Login</button>
</div>
</div>
