<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REVEALED LOGISTICS 17 Real Trucks</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f7f9fc}header{background:#001a4d;color:#fff;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:100}h1{color:#ffcc00;font-size:15px}.btn{background:#ffcc00;border:none;padding:8px 14px;border-radius:20px;font-weight:bold}#status{padding:10px;text-align:center;font-weight:bold;display:none;background:#fff3cd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.card{background:#fff;border:2px solid #ffcc00;border-radius:12px;overflow:hidden}.card img{width:100%;height:120px;object-fit:cover;background:#eee}.card-body{padding:6px;text-align:center}.hire{width:100%;padding:7px;background:#ffcc00;border:none;border-radius:6px;font-weight:bold}
</style></head><body>
<header><h1>REVEALED LOGISTICS</h1><button class="btn" onclick="login()">Login Pi</button></header>
<div id="status">Loading your 17 images from root...</div>
<div style="background:#001a4d;color:#fff;padding:10px;text-align:center">17 REAL TRUCKS | revealed.logistics@gmail.com | +27 60 726 3726</div>
<div class="grid" id="fleet"></div>

<script>
function show(m,c){let el=document.getElementById('status');el.style.display='block';if(c)el.style.background=c;el.innerText=m;}

// AUTO LOAD 17 IMAGES FROM YOUR GITHUB ROOT
async function loadMyImages(){
  show("🔍 Scanning your root for 17 images...");
  try{
    // Try your repo - change username if different
    let repo = "ndhlovu36/revealed-logistics";
    let api = `https://api.github.com/repos/${repo}/contents`;
    let res = await fetch(api);
    let files = await res.json();
    let images = files.filter(f => f.name.match(/\.(jpg|jpeg|png|webp)$/i));

    show(`Found ${images.length} images in root ✅ - Building fleet...`,"#ccffcc");

    let fleetNames = ["Side Tipper","Tautliner","Flat Deck","Abnormal Load","Fuel Tank","Refrigerated","Box Body","Dropside","Tanker","Lowbed","Tipper","Panel Van","Horse Trailer","Crane Truck","Interlink","Superlink","Mixer"];
    let prices = [5,5,6,8,6,7,4,4,6,9,5,2,7,8,8,9,6];

    let html="";
    images.slice(0,17).forEach((img,i)=>{
      let name = fleetNames[i]||`Truck ${i+1}`;
      let price = prices[i]||5;
      // Use raw GitHub URL + local fallback
      html+=`<div class="card">
        <img src="${img.download_url}" onerror="this.src='${img.name}'">
        <div class="card-body"><b>${i+1}. ${name}</b><button class="hire" onclick="hire('${name}',${price})">Hire - ${price} Pi</button><br><small style="font-size:9px;color:#666">${img.name}</small></div>
      </div>`;
    });
    document.getElementById('fleet').innerHTML = html || "<p style='text-align:center;padding:20px'>No images found in root. Check repo is public and images are.jpg</p>";

  }catch(e){
    show("GitHub API failed: "+e.message+" - Using direct filenames","#ffcccc");
    // FALLBACK - Try common WhatsApp names
    let names=[];
    for(let i=0;i<10;i++) names.push(`IMG-20260916-WA000${i}.jpg`);
    for(let i=0;i<10;i++) names.push(`IMG-20260918-WA000${i}.jpg`);
    for(let i=0;i<10;i++) names.push(`IMG-20250916-WA000${i}.jpg`);
    for(let i=0;i<10;i++) names.push(`IMG-20250918-WA000${i}.jpg`);
    let html="";
    names.slice(0,17).forEach((n,i)=>{
      html+=`<div class="card"><img src="${n}" onerror="this.style.display='none'"><div class="card-body"><b>${i+1}</b><button class="hire">Hire</button><br><small>${n}</small></div></div>`;
    });
    document.getElementById('fleet').innerHTML=html;
  }
}
loadMyImages();

// PI LOGIN FIXED - MUST BE SANDBOX TRUE
window.onload=()=>{
  setTimeout(()=>{
    try{Pi.init({version:"2.0",sandbox:true});show("Pi SDK Loaded ✅ - Tap Login Pi (in Pi Browser) | Images loaded above","#ccffcc");}catch(e){show("Pi SDK error: "+e.message,"#ffcccc");}
  },800);
};
let piUser=null;
async function login(){
  if(typeof Pi==='undefined'){show("❌ NOT in Pi Browser! Open Pi Browser App then open https://revealed-logistics.vercel.app","#ffcccc");return;}
  show("⏳ Check Pi Browser popup for permission...");
  try{let a=await Pi.authenticate(['username','payments'],()=>{});piUser=a.user;show("✅ Welcome "+a.user.username+" - Pi Connected!","#ccffcc");}catch(err){show("❌ "+err.message+" - Go to develop.pi -> App URL = https://revealed-logistics.vercel.app + Sandbox ON","#ffcccc");}
}
function hire(n,p){alert(n+" - "+p+" Pi\nLogin Pi to pay\nWhatsApp +27607263726\nEmail revealed.logistics@gmail.com");}
</script>
</body></html>
