<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REVEALED LOGISTICS</title>
<style>
body{background:#001a4d;color:#fff;font-family:Arial;margin:0;padding:10px;text-align:center}
.inp{width:92%;padding:12px;margin:6px;border-radius:10px;border:0;font-size:16px}
.sel{width:95%;padding:12px;margin:6px;border-radius:10px;border:0;background:white;font-weight:bold}
.btn{padding:12px;border-radius:10px;border:0;font-weight:bold;margin:4px;cursor:pointer;width:95%}
.btn-pi{background:gold;color:#000;padding:14px;width:48%;border-radius:12px;font-size:16px;margin:6px 1%;border:0}
.btn-cancel{background:#ff3b3b;color:#fff;padding:14px;width:48%;border-radius:12px;font-size:16px;margin:6px 1%;border:0}
.fleet{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px}
.card{background:#fff;color:#000;border-radius:12px;overflow:hidden;padding-bottom:8px;cursor:pointer;border:3px solid transparent}
.card img{width:100%;height:90px;object-fit:cover;display:block}
.card.selected{border-color:gold}
.status{background:#000;padding:12px;border-radius:8px;margin:10px;font-size:13px;word-break:break-word}
.dist-box{background:#fff;color:#000;padding:14px;border-radius:12px;margin:10px;text-align:left;display:none}
.price-big{font-size:26px;color:#001a4d;background:gold;padding:8px 14px;border-radius:8px;display:inline-block;margin:6px 0;font-weight:bold}
.action-bar{display:none;margin:10px}
.weight-box{background:#002366;padding:10px;border-radius:10px;margin:10px;border:1px solid gold}
</style>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
<h2>REVEALED LOGISTICS</h2>
<button class="btn" id="loginBtn" style="background:white;color:#000;" onclick="login()">🔐 Login with Pi - TAP HERE</button>
<p id="modeText">Mode: testnet - Must open in Pi Browser</p>

<datalist id="saCities">
<option value="Johannesburg"><option value="Pretoria"><option value="Durban"><option value="Cape Town"><option value="Midrand"><option value="Sandton"><option value="Centurion"><option value="Soweto"><option value="Pinetown"><option value="Umhlanga"><option value="Gqeberha"><option value="Port Elizabeth"><option value="East London"><option value="Bloemfontein"><option value="Polokwane"><option value="Mbombela"><option value="Nelspruit"><option value="Rustenburg"><option value="Kimberley">
</datalist>

<input id="pickup" class="inp" list="saCities" placeholder="Pickup: Durban" value="Durban" oninput="updateQuote()">
<input id="drop" class="inp" list="saCities" placeholder="Drop: Midrand" value="Midrand" oninput="updateQuote()">

<div class="weight-box">
<b>⚖️ Load Weight</b><br>
<select id="tons" class="sel" onchange="updateQuote()">
<option value="">-- Select Tons --</option>
<option value="1">1 Ton</option><option value="5">5 Tons</option><option value="10">10 Tons</option><option value="20">20 Tons</option><option value="30">30 Tons</option><option value="34" selected>34 Tons Full</option>
</select>
</div>

<div id="distBox" class="dist-box"></div>

<div class="fleet">
<div class="card" onclick="selectFleet(this,'Side Tipper 34T',0.0045,8,34)"><img src="IMG-20260918-WA0397.jpg"><b>Side Tipper</b><br><small>Max 34T</small></div>
<div class="card" onclick="selectFleet(this,'Flat Deck 34T',0.0038,6,34)"><img src="IMG-20260916-WA8594.jpg"><b>Flat Deck</b><br><small>Max 34T</small></div>
<div class="card" onclick="selectFleet(this,'Side Curtain 30T',0.0035,5,30)"><img src="IMG-20260916-WA7873.jpg"><b>Side Curtain</b><br><small>Max 30T</small></div>
<div class="card" onclick="selectFleet(this,'Panel Van 1.5T',0.0018,1.2,1.5)"><img src="IMG-20260916-WA9084.jpg"><b>Panel Van</b><br><small>Max 1.5T</small></div>
<div class="card" onclick="selectFleet(this,'Abnormal Load 60T',0.008,12,60)"><img src="IMG-20260916-WA2791.jpg"><b>Abnormal Load</b><br><small>Max 60T</small></div>
<div class="card" onclick="selectFleet(this,'Refrigerated 28T',0.005,7,28)"><img src="IMG-20260916-WA1910.jpg"><b>Refrigerated</b><br><small>Reefer 28T</small></div>
<div class="card" onclick="selectFleet(this,'Fuel Tanker 34T',0.006,9,34)"><img src="IMG-20260916-WA0687.jpg"><b>Fuel Tanker</b><br><small>Max 34T</small></div>
<div class="card" onclick="selectFleet(this,'8th Fleet 34T',0.004,6,34)"><img src="IMG-20260918-WA0397.jpg"><b>8th Fleet</b><br><small>Max 34T</small></div>
</div>

<input type="hidden" id="truck"><input type="hidden" id="truckRate"><input type="hidden" id="truckBase"><input type="hidden" id="truckMax">
<div id="actionBar" class="action-bar">
<button class="btn btn-cancel" onclick="cancelQuote()">❌ Cancel</button>
<button class="btn btn-pi" id="payBtn" onclick="pay()">💳 Pay with Pi</button>
</div>
<div id="status" class="status">Ready - Select truck to see price</div>

<script>
const cityCoords={"Johannesburg":{lat:-26.2041,lon:28.0473},"Pretoria":{lat:-25.7479,lon:28.2293},"Durban":{lat:-29.8587,lon:31.0218},"Cape Town":{lat:-33.9249,lon:18.4241},"Midrand":{lat:-25.9987,lon:28.1284},"Sandton":{lat:-26.1061,lon:28.0567},"Centurion":{lat:-25.8603,lon:28.1894},"Soweto":{lat:-26.2678,lon:27.8585},"Pinetown":{lat:-29.8186,lon:30.8549},"Umhlanga":{lat:-29.7251,lon:31.0827},"Gqeberha":{lat:-33.9608,lon:25.6022},"Port Elizabeth":{lat:-33.9608,lon:25.6022},"East London":{lat:-33.0153,lon:27.9116},"Bloemfontein":{lat:-29.0852,lon:26.1596},"Polokwane":{lat:-23.9045,lon:29.4689},"Mbombela":{lat:-25.4753,lon:30.9694},"Nelspruit":{lat:-25.4753,lon:30.9694},"Rustenburg":{lat:-25.6678,lon:27.2419},"Kimberley":{lat:-28.7282,lon:24.7499}};
function haversine(a,b){const R=6371;const dLat=(b.lat-a.lat)*Math.PI/180;const dLon=(b.lon-a.lon)*Math.PI/180;const lat1=a.lat*Math.PI/180;const lat2=b.lat*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
let user=null,selected=null,isPaying=false,lastKm=0,currentPrice=0;

// INIT - never block
let piReady=false;
try{
 Pi.init({version:"2.0", sandbox:true});
 piReady=true;
 document.getElementById('status').innerText="Pi SDK loaded - Tap Login";
}catch(e){
 document.getElementById('status').innerText="Pi SDK failed: "+e.message+" - Open in Pi Browser";
}

function selectFleet(el,name,rate,base,max){
 if(selected)selected.classList.remove('selected');
 el.classList.add('selected');selected=el;
 document.getElementById('truck').value=name;
 document.getElementById('truckRate').value=rate;
 document.getElementById('truckBase').value=base;
 document.getElementById('truckMax').value=max;
 updateQuote();
}
function updateQuote(){
 let pu=document.getElementById('pickup').value.trim()||"Durban";
 let dr=document.getElementById('drop').value.trim()||"Midrand";
 let tons=parseFloat(document.getElementById('tons').value)||34;
 let tr=document.getElementById('truck').value;
 let rate=parseFloat(document.getElementById('truckRate').value)||0.0045;
 let base=parseFloat(document.getElementById('truckBase').value)||8;
 let box=document.getElementById('distBox');
 let bar=document.getElementById('actionBar');
 let c1=cityCoords[pu]; let c2=cityCoords[dr];
 if(!c1||!c2){box.style.display='block';box.innerHTML=`${pu}→${dr} calculating...`;return;}
 let kmRoad=Math.round(haversine(c1,c2)*1.28); lastKm=kmRoad;
 let price=base+(kmRoad*rate)+(tons*0.12); price=Math.round(price*100)/100;
 currentPrice=price; window.currentPrice=price;
 box.style.display='block'; bar.style.display='block';
 box.innerHTML=`📏 <b>${pu} → ${dr}</b> = <b>${kmRoad}km</b><br>⚖️ ${tons}T | ${tr||'Select truck below'}<br><span class="price-big">💰 π ${price}</span>`;
 document.getElementById('status').innerText=`Price π ${price} - ${!tr?'Tap truck, then Login':'Login then Pay'}`;
}
function cancelQuote(){document.getElementById('pickup').value='';document.getElementById('drop').value='';document.getElementById('tons').value='34';document.getElementById('truck').value='';if(selected)selected.classList.remove('selected');selected=null;document.getElementById('distBox').style.display='none';document.getElementById('actionBar').style.display='none';currentPrice=0;}
async function login(){
 let btn=document.getElementById('loginBtn');
 if(!piReady){document.getElementById('status').innerText='❌ Pi SDK not ready - You are in Chrome. Open this link INSIDE Pi Browser app: l-logistics.vercel.app'; return;}
 if(typeof Pi==='undefined'){document.getElementById('status').innerText='❌ Pi not found - Open in Pi Browser'; return;}
 btn.innerText='Connecting... (5 sec)';
 document.getElementById('status').innerText='Connecting... If it hangs, you are NOT in Pi Browser';

 // ANTI-FREEZE: timeout after 8 seconds
 let timeout=setTimeout(()=>{btn.innerText='🔐 Login - Retry';document.getElementById('status').innerText='❌ Login timeout - You are NOT in Pi Browser. Open Pi Browser > Enter URL: l-logistics.vercel.app';},8000);

 try{
  const auth=await Pi.authenticate(['username','payments'], (p)=>{ return fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:p.identifier,txid:p.transaction.txid})}); });
  clearTimeout(timeout);
  user=auth.user;
  btn.innerText='✅ '+user.username;
  document.getElementById('status').innerText='✅ Welcome '+user.username+' - Now Pay π '+currentPrice;
 }catch(e){
  clearTimeout(timeout);
  console.error(e);
  document.getElementById('status').innerText='❌ Login error: '+(e.message||e)+'. Solution: Open Pi Browser app, not Chrome, and allow popups.';
  btn.innerText='🔐 Login Retry';
 }
}
async function pay(){if(isPaying)return;if(!user){alert('Login first - open in Pi Browser');return;}isPaying=true;let btn=document.getElementById('payBtn');btn.innerText='Paying...';try{Pi.createPayment({amount:currentPrice,memo:`${document.getElementById('tons').value}T ${document.getElementById('truck').value} ${document.getElementById('pickup').value}->${document.getElementById('drop').value}`.slice(0,90),metadata:{km:lastKm,price:currentPrice}},{onReadyForServerApproval:async pid=>{await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid})})},onReadyForServerCompletion:async(pid,txid)=>{await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid,txid:txid})});document.getElementById('status').innerText=`✅ Paid π ${currentPrice}!`;isPaying=false;btn.innerText='💳 Pay with Pi';},onCancel:()=>{isPaying=false;btn.innerText='💳 Pay with Pi';},onError:e=>{document.getElementById('status').innerText='Error '+e;isPaying=false;btn.innerText='💳 Pay with Pi';}});}catch(e){document.getElementById('status').innerText='Error '+e;isPaying=false;}}
setTimeout(updateQuote,500);
</script>
</body>
</html>
