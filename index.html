<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REVEALED LOGISTICS</title>
<style>
body{background:#001a4d;color:#fff;font-family:Arial;margin:0;padding:10px;text-align:center}
.inp{width:92%;padding:12px;margin:6px;border-radius:10px;border:0}
.btn.btn-pi{background:gold;color:#000;padding:14px;width:95%;border-radius:12px;font-weight:bold;font-size:17px;border:0;margin:10px 0}
.fleet{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px}
.card{background:#fff;color:#000;border-radius:10px;overflow:hidden;padding-bottom:6px;cursor:pointer;border:3px solid transparent}
.card img{width:100%;height:90px;object-fit:cover;display:block}
.card.selected{border-color:gold}
.status{background:#000;padding:10px;border-radius:8px;margin-top:10px}
</style>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
<h2>REVEALED LOGISTICS</h2>
<p>8 Fleets - SA Wide - Real Trucks</p>

<input id="pickup" class="inp" placeholder="Pickup - e.g. Johannesburg">
<input id="drop" class="inp" placeholder="Drop - e.g. Durban">

<div class="fleet" id="fleetGrid">
<div class="card" onclick="selectFleet(this,'WA0397 Side Tipper')"><img src="IMG-20260918-WA0397.jpg"><b>Side Tipper 34T</b></div>
<div class="card" onclick="selectFleet(this,'Flat Deck')"><img src="IMG-20260916-WA8594.jpg"><b>Flat Deck / Tautliner</b></div>
<div class="card" onclick="selectFleet(this,'Side Curtain')"><img src="IMG-20260916-WA7873.jpg"><b>Side Curtain</b></div>
<div class="card" onclick="selectFleet(this,'Panel Van')"><img src="IMG-20260916-WA9084.jpg"><b>Panel Van</b></div>
<div class="card" onclick="selectFleet(this,'Abnormal Load')"><img src="IMG-20260916-WA2791.jpg"><b>Abnormal Load</b></div>
<div class="card" onclick="selectFleet(this,'Refrigerated')"><img src="IMG-20260916-WA1910.jpg"><b>Refrigerated</b></div>
<div class="card" onclick="selectFleet(this,'Fuel Tanker')"><img src="IMG-20260916-WA0687.jpg"><b>Fuel Tanker</b></div>
<div class="card" onclick="selectFleet(this,'Other Truck')"><img src="IMG-20260918-WA0397.jpg"><b>Other - 8th Fleet</b></div>
</div>

<input type="hidden" id="truck" value="">
<input id="wa" class="inp" placeholder="WhatsApp number">

<button class="btn btn-pi" id="payBtn">Book & Pay with Pi</button>
<div id="status" class="status">✅ Pickup & Drop tabs live - Click a truck</div>

<script>
let selectedCard=null;
function selectFleet(el,name){
if(selectedCard) selectedCard.classList.remove('selected');
el.classList.add('selected'); selectedCard=el;
document.getElementById('truck').value=name;
document.getElementById('status').innerText='✅ Selected: '+name+' - Pickup & Drop tabs live';
}
let isPaying=false;
async function pay(){
if(isPaying) return;
let pickup=document.getElementById('pickup').value;
let drop=document.getElementById('drop').value;
let truck=document.getElementById('truck').value;
if(!pickup||!drop){alert('Enter Pickup & Drop');return;}
if(!truck){alert('Click a truck photo first');return;}
isPaying=true; let btn=document.getElementById('payBtn'); btn.innerText='Paying...';
try{
Pi.createPayment({amount:1,memo:'Revealed '+truck+' '+pickup+' to '+drop,metadata:{pickup:pickup,dropoff:drop,truck:truck}},{
onReadyForServerApproval:async(pid)=>{await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid})})},
onReadyForServerCompletion:async(pid,txid)=>{await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid,txid:txid})}); document.getElementById('status').innerText='✅ Paid! '+truck; isPaying=false; btn.innerText='Book & Pay with Pi';},
onCancel:()=>{isPaying=false; btn.innerText='Book & Pay with Pi';},
onError:(e)=>{document.getElementById('status').innerText='Error '+e; isPaying=false; btn.innerText='Book & Pay with Pi';}
});
}catch(e){document.getElementById('status').innerText='Error '+e; isPaying=false; btn.innerText='Book & Pay with Pi';}
}
document.getElementById('payBtn').onclick=pay;
</script>
</body>
</html>
