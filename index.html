<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REVEALED LOGISTICS</title><script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>Pi.init({version:"2.0",sandbox:true})</script>
<style>body{margin:0;font-family:Arial;background:#0a1931;color:#fff;text-align:center}.h{padding:20px;border-bottom:3px solid #d4af37}.logo{font-size:28px;font-weight:bold;color:#d4af37}.card{background:#fff;color:#0a1931;margin:15px auto;max-width:420px;border-radius:15px;padding:20px;text-align:left}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid #d4af37;border-radius:10px;padding:12px;text-align:center}.item b{display:block}button{width:100%;padding:12px;margin-top:8px;border:none;border-radius:8px;font-weight:bold;background:#d4af37} .btn-login{background:#0a1931;color:#d4af37;border:2px solid #d4af37;margin-top:15px}input{width:100%;padding:12px;margin-top:5px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}</style>
</head><body><div class="h"><div class="logo">🚚 REVEALED LOGISTICS</div><div>Pay with Pi Only - Gauteng SA</div></div>
<div class="card"><div class="grid"><div class="item"><b>Tautliner</b>15 Pi<button onclick="pay(15,'Tautliner')">Book 15 Pi</button></div><div class="item"><b>Reefer</b>20 Pi<button onclick="pay(20,'Reefer')">Book 20 Pi</button></div><div class="item"><b>Side Tipper</b>18 Pi<button onclick="pay(18,'Side Tipper')">Book 18 Pi</button></div><div class="item"><b>Tanker</b>25 Pi<button onclick="pay(25,'Tanker')">Book 25 Pi</button></div><div class="item"><b>Flatbed</b>12 Pi<button onclick="pay(12,'Flatbed')">Book 12 Pi</button></div><div class="item"><b>Superlink</b>22 Pi<button onclick="pay(22,'Superlink')">Book 22 Pi</button></div></div>
<label style="margin-top:15px;display:block;font-weight:bold">From</label><input id="from" placeholder="Johannesburg">
<label style="display:block;font-weight:bold;margin-top:5px">To</label><input id="to" placeholder="Durban">
<button class="btn-login" onclick="login()">🔐 Login with Pi</button>
<div id="user" style="color:green;text-align:center;font-weight:bold;margin-top:10px"></div><div id="status" style="text-align:center;margin-top:8px;font-weight:bold"></div>
<div style="text-align:center;margin-top:15px;font-size:12px"><a href="/privacy.html">Privacy</a> | <a href="/Legal.html">Legal</a></div>
</div><script>let u=null;function login(){Pi.authenticate(['username','payments'],()=>{}).then(a=>{u=a.user;document.getElementById('user').innerText="Welcome @"+a.user.username})}function pay(amt,svc){if(!u){alert("Login first");return}Pi.createPayment({amount:amt,memo:svc},{onReadyForServerApproval:id=>{document.getElementById('status').innerText="Approving...";fetch('/api/approve-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})})},onReadyForServerCompletion:(id,txid)=>{fetch('/api/complete-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,txid:txid})}).then(()=>{document.getElementById('status').innerText="✅ Paid "+amt+" Pi - "+svc+" Booked!"})}})}</script></body></html>
