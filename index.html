<style>

<div style="background:#fff;margin:12px;padding:14px;border-radius:12px;border:2px solid #001a4d">
<label>Pickup City *</label><input id="pick" list="africaList" placeholder="Henley on Klip">

<label>Drop City *</label><input id="drop" list="africaList" placeholder="Johannesburg">
<label>Drop Address</label><input id="dropAddress">
<label>Qty (1-20)</label><input id="truckQty" type="number" value="1" min="1" max="20" oninput="calc()">
<datalist id="africaList"></datalist>

<button class="btn" style="background:#ff8c00" onclick="payPi()">Pay Pi</button>
<div id="stat" style="background:#fff3cd;padding:10px;border-radius:8px;margin-top:8px;font-weight:bold">Ready - v28.4b Fixed Complete</div>
</div>
<script>
let sel="",price=0.2,user=null,km=0,currentNet=localStorage.getItem('net')||'mainnet';
function hire(n){sel=n;document.getElementById('stat').innerText="✅ Selected "+n;calc();}
function setNet(n){currentNet=n;localStorage.setItem('net',n);document.getElementById('bMain').className=n==='mainnet'?'active':'';document.getElementById('bTest').className=n==='testnet'?'active':'';document.getElementById('piStatus').innerText="✅ "+n+" ready";}
async function loginPi(){if(typeof Pi==='undefined'){document.getElementById('stat').innerText='Open in Pi Browser to Login';return;}try{Pi.init({version:"2.0",sandbox:currentNet==='testnet'});const a=await Pi.authenticate(['username','payments'],()=>{});user=a.user;document.getElementById('piStatus').innerText="✅ "+user.username;}catch(e){document.getElementById('stat').innerText=e.message;}}
function hav(a,b,c,d){var R=6371;var dLat=(c-a)*Math.PI/180;var dLon=(d-b)*Math.PI/180;var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
const cities={"johannesburg":[-26.2041,28.0473],"pretoria":[-25.7479,28.2293],"durban":[-29.8587,31.0218],"cape town":[-33.9249,18.4241],"polokwane":[-23.9045,29.4689],"giyani":[-23.31,30.68],"musina":[-22.34,30.04],"bloemfontein":[-29.0852,26.1596],"east london":[-33.0153,27.9116],"port elizabeth":[-33.9608,25.6022],"nelspruit":[-25.4753,30.9694],"rustenburg":[-25.6677,27.2419],"kimberley":[-28.7282,24.7499],"upington":[-28.4479,21.2561],"vereeniging":[-26.6731,27.9261],"vanderbijlpark":[-26.7114,27.8347],"henley on klip":[-26.5445,28.0667],"meyerton":[-26.5553,28.0187],"harare":[-17.8292,31.0335],"bulawayo":[-20.1325,28.6265],"lusaka":[-15.4067,28.2871],"maputo":[-25.9692,32.5732],"windhoek":[-22.5609,17.0658],"gaborone":[-24.6282,25.9231]};
try{const dl=document.getElementById('africaList');Object.keys(cities).sort().forEach(k=>{let o=document.createElement('option');o.value=k.charAt(0).toUpperCase()+k.slice(1);dl.appendChild(o);});}catch(e){}
function findCity(n){n=n.toLowerCase().trim();if(cities[n])return cities[n];for(let k in cities){if(n.includes(k)||k.includes(n))return cities[k];}return null;}
function calc(){let qty=parseInt(document.getElementById('truckQty').value)||1;let p=document.getElementById('pick').value.toLowerCase().trim();let d=document.getElementById('drop').value.toLowerCase().trim();let box=document.getElementById('calcBox');if(!sel){box.innerText="Tap HIRE - "+qty+" trucks";return 0;}if(!p||!d){box.innerText="Truck: "+sel+" x"+qty+" - Enter cities";return 0;}let pk=findCity(p);let dk=findCity(d);if(pk&&dk){km=Math.round(hav(pk[0],pk[1],dk[0],dk[1])*1.32);if(km<30)km=30;}else{km=50;}let tot=price*km/100*qty;box.innerHTML="Truck: <b>"+sel+"</b> x"+qty+"<br>"+p+" -> "+d+"<br>Km: <b>"+km+"</b><br><span style='font-size:20px;color:#ffcc00'>TOTAL Pi "+tot.toFixed(4)+"</span>";return tot;}
async function payPi(){let tot=calc();if(!sel){alert('Tap Hire');return;}if(typeof Pi==='undefined'){alert('Open in Pi Browser');return;}if(!user){await loginPi();if(!user)return;}document.getElementById('stat').innerText="Paying Pi "+tot;try{await Pi.createPayment({amount:tot,memo:"REVEALED "+sel,metadata:{truck:sel}},{onReadyForServerApproval:id=>{fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})})},onReadyForServerCompletion:(id,txid)=>{document.getElementById('stat').innerText="PAID ✅ Pi "+tot+" TXID: "+txid;},onCancel:()=>{document.getElementById('stat').innerText="Cancelled";},onError:e=>{document.getElementById('stat').innerText=e.message;}});}catch(e){document.getElementById('stat').innerText=e.message;}}
</script>
