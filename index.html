<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revealed Logistics | 8 Truck Types</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f5f7fb}
.header{background:#0a1931;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;color:#ffcc00}.hero{background:#0a1931;color:#fff;text-align:center;padding:60px 20px}
.hero h1{font-size:28px}.hero h1 span{color:#ffcc00}.btn{background:#ffcc00;color:#0a1931;padding:12px 25px;border-radius:30px;text-decoration:none;font-weight:900;display:inline-block;margin-top:15px}
.section{padding:30px 15px;max-width:1200px;margin:auto}.fleet{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(min-width:800px){.fleet{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.1);position:relative}
.card img{width:100%;height:170px;object-fit:cover;background:#ddd}
.card-body{padding:10px}.card-body h3{font-size:13px;color:#0a1931}.badge{position:absolute;top:8px;left:8px;background:#ffcc00;font-size:10px;font-weight:900;padding:3px 8px;border-radius:20px}
</style>
</head>
<body>
<div class="header"><div class="logo">REVEALED LOGISTICS</div><div>8 TRUCK TYPES</div></div>
<div class="hero"><h1>WE OPERATE<br><span>8 TRUCK TYPES</span><br>NOT ONE.</h1><a class="btn" href="https://wa.me/27700000000">GET QUOTE</a></div>
<div class="section">
<div id="fleet" class="fleet">Loading your 8 trucks...</div>
</div>
<script>
async function loadFleet(){
  const res = await fetch('https://api.github.com/repos/Ndhlovu36/revealed-logistics/contents?ref=main');
  const files = await res.json();
  const imgs = files.filter(f=> f.name.toLowerCase().startsWith('img-') && (f.name.endsWith('.jpg')||f.name.endsWith('.jpeg')||f.name.endsWith('.png')||f.name.endsWith('.JPG')) ).map(f=>f.name);
  imgs.sort();
  const titles = ["Side Tipper - Blue Scania","Fuel Tanker","Refrigerated - Fridge","End Tipper","Tautliner","Flat Deck / Lowbed","Abnormal Load","Delivery Vans"];
  const descs = ["Chrome Ore","Diesel 50k L","-25°C Cold Chain","Coal & Aggregate","General Cargo","Steel & Timber","Mining Machines","Last Mile JHB"];
  const container = document.getElementById('fleet');
  container.innerHTML='';
  imgs.forEach((name,i)=>{
    const t = titles[i]||"Fleet "+(i+1);
    const d = descs[i]||"Revealed Logistics";
    container.innerHTML+=`<div class="card"><span class="badge">TYPE 0${i+1}</span><img src="${name}" alt="${t}"><div class="card-body"><h3>${t}</h3><p style="font-size:11px;color:#666">${d}</p></div></div>`;
  });
  if(imgs.length==0) container.innerHTML="No IMG files found - please upload JPGs";
}
loadFleet();
</script>
</body>
</html>
