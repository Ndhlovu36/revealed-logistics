<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revealed Logistics</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:Arial;background:#eef4ff;padding:20px}
.box{background:#fff;padding:15px;border-radius:12px;margin:10px 0}
.btn{padding:12px 20px;border:none;border-radius:20px;font-weight:900;width:100%;margin:5px 0}
.blue{background:#0052cc;color:#fff}
.red{background:#ff4444;color:#fff}
.status{padding:10px;background:#f0f0f0;border-radius:8px;margin-top:10px;font-size:12px;word-break:break-all}
</style>
</head>
<body>
<div class="box">
<h3>REVEALED LOGISTICS - Pi Payment Fixed</h3>
<button class="btn blue" id="loginBtn" onclick="login()">π Login</button>
<button class="btn red" onclick="pay()">🧪 Pay Test Pi</button>
<div class="status" id="status">Not logged in - Open in Pi Browser</div>
</div>

<script>
Pi.init({version:"2.0",sandbox:true});
let user=null;

async function login(){
 try{
  document.getElementById('status').innerText='Connecting...';
  let auth=await Pi.authenticate(['username','payments','wallet_address'],p=>{});
  user=auth.user;
  document.getElementById('loginBtn').innerText='✓ '+auth.user.username;
  document.getElementById('status').innerText='✅ Logged in as '+auth.user.username+' - Ready to pay';
  document.getElementById('status').style.background='#dcfce7';
 }catch(e){
  document.getElementById('status').innerText='❌ '+e.message+' - Open in Pi Browser App!';
 }
}

async function pay(){
 if(!user){alert('Login first');return}
 document.getElementById('status').innerText='Creating payment...';
 try{
  await Pi.createPayment({amount:1,memo:"Revealed Test",metadata:{order:"RL-123"}},{
   onReadyForServerApproval:id=>{document.getElementById('status').innerText='Approving '+id},
   onReadyForServerCompletion:(id,txid)=>{document.getElementById('status').innerText='✅ SUCCESS TXID:'+txid;alert('Paid! TX:'+txid)},
   onCancel:id=>{document.getElementById('status').innerText='Cancelled'},
   onError:(e)=>{document.getElementById('status').innerText='Error:'+e.message}
  });
 }catch(e){
  document.getElementById('status').innerText='Pay error:'+e.message;
 }
}
</script>
</body>
</html>
