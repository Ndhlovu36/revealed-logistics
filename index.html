function initPi(isTest){try{if(typeof Pi==='undefined'){document.getElementById('piStatus').innerText='Open in Pi Browser';return false;}Pi.init({version:"2.0",sandbox:isTest});document.getElementById('piStatus').innerText="Pi Ready - "+(isTest?"TESTNET":"MAINNET")+" - Tap Login";document.getElementById('piStatus').style.background=isTest?"#ff8c00":"#004400";return true;}catch(e){return false;}}
setTimeout(()=>initPi(currentNet==='testnet'),800);
async function loginPi(){
 const s=document.getElementById('stat');
 if(typeof Pi==='undefined'){s.innerText='Open in Pi Browser App';return;}
 s.innerText='Checking pending...';
 const onIncomplete = (payment)=>{
   s.innerText='Found pending '+payment.identifier.slice(0,8)+'... clearing';
   if(payment.transaction && payment.transaction.txid){
     fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:payment.identifier,txid:payment.transaction.txid})}).then(()=>{s.innerText='✅ Completed old tx - CLOSE Pi Browser fully and Login again';});
   }else{
     fetch('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:payment.identifier})}).then(()=>{s.innerText='✅ Cancelled old pending - CLOSE Pi Browser fully and Login again';});
   }
 };
 try{
  const auth=await Pi.authenticate(['username','payments'], onIncomplete);
  user=auth.user;document.getElementById('puser').value=user.username;
  document.getElementById('piStatus').innerText="✅ "+user.username;document.getElementById('piStatus').style.background="#004400";
  s.innerText="✅ Login OK "+user.username+" - you can Pay now";
 }catch(e){s.innerText="Login: "+e.message;}
}
function setNet(n){currentNet=n;localStorage.setItem('net',n);initPi(n==='testnet');document.getElementById('bMain').className=n==='mainnet'?'active':'';document.getElementById('bTest').className=n==='testnet'?'active':'';document.getElementById('stat').innerText="Switched to "+n+" - Login again";user=null;}

function hav(a,b,c,d){var R=6371;var dLat=(c-a)*Math.PI/180;var dLon=(d-b)*Math.PI/180;var x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function findCity(n){n=n.toLowerCase().trim();if(cities[n])return cities[n];for(var k in cities){if(n.includes(k)||k.includes(n))return cities[k];}return null;}
function calc(){var p=document.getElementById('pick').value.toLowerCase().trim();var d=document.getElementById('drop').value.toLowerCase().trim();var dt=document.getElementById('date').value;var box=document.getElementById('calcBox');if(!sel){box.innerHTML="Tap HIRE";return 0}if(!p||!d){box.innerHTML="Truck: <b>"+sel+"</b><br>Enter Pickup & Drop City";return 0}var pk=findCity(p);var dk=findCity(d);if(pk&&dk){km=Math.round(hav(pk[0],pk[1],dk[0],dk[1])*1.32);if(km<30)km=30;}else{km=0;var all=Object.keys(cities);var best=0;all.forEach(function(c){if(p[0]===c[0])best=400;});km=best||380+Math.round(Math.random()*120);}var tot=price*km/100;tot=parseFloat(tot.toFixed(4));box.innerHTML="Truck: <b>"+sel+"</b><br>Route: "+p+" -> "+d+"<br>Distance: <b>"+km+" km</b><br><span style='font-size:22px;color:#ffcc00'>TOTAL: Pi "+tot+"</span><br>Date: "+(dt||'Select');return tot;}

async function payPi(){
 var cn=document.getElementById('clientName').value.trim();var cp=document.getElementById('clientPhone').value.trim();var ce=document.getElementById('clientEmail').value.trim();var pickup=document.getElementById('pick').value.trim();var pickAddr=document.getElementById('pickAddress').value.trim();var drop=document.getElementById('drop').value.trim();var dropAddr=document.getElementById('dropAddress').value.trim();var date=document.getElementById('date').value;
 if(!sel){alert('Tap Hire first');return}if(!cn||!cp||!ce){alert('Enter Client details');return}if(!pickup||!pickAddr||!drop||!dropAddr||!date){alert('Fill all fields');return}if(!user){alert('Login Pi first');await loginPi();if(!user)return}
 var tot=calc();document.getElementById('stat').innerText="Creating payment Pi "+tot+"...";
 try{
  await Pi.createPayment({amount:tot,memo:("REVEALED "+sel+" "+pickup+"->"+drop).substring(0,28),metadata:{clientName:cn,clientPhone:cp,clientEmail:ce,pickupCity:pickup,pickupAddress:pickAddr,dropCity:drop,dropAddress:dropAddr,date:date,truck:sel,distance:km,network:currentNet,companyEmail:"revealed.logistics@gmail.com",reg:"2024/163979/07"}},{
   onReadyForServerApproval:function(id){document.getElementById('stat').innerText="Approving "+id+"...";fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})}).then(r=>r.json()).then(()=>{document.getElementById('stat').innerText="Approved - Check wallet";});},
   onReadyForServerCompletion:function(id,txid){document.getElementById('stat').innerText="PAID ✅ Pi "+tot+" TX:"+txid;fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,txid:txid,clientEmail:ce,clientName:cn,pickupAddress:pickAddr,dropAddress:dropAddr})});},
   onCancel:function(){document.getElementById('stat').innerText="Cancelled";},onError:function(e){document.getElementById('stat').innerText="Error "+e.message;}
  });

}
