<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REVEALED 17 FLEETS</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><style>body{margin:0;background:#0a1931;color:#fff;font-family:Arial}.top{padding:12px;display:flex;gap:8px;background:#0a1931;border-bottom:2px solid #d4af37;position:sticky;top:0;z-index:999}.fleet-card{background:#fff;color:#000;border-radius:14px;overflow:hidden;margin:6px;border:2px solid #d4af37}.fleet-card img{width:100%;height:180px;object-fit:cover}.btn{width:100%;padding:10px;background:#d4af37;border:none;border-radius:10px;font-weight:900}</style></head><body>
<div class="top"><b style="color:#d4af37">REVEALED - 17 FLEETS</b><button id="loginBtn" style="margin-left:auto;padding:8px 12px;border-radius:20px;background:#d4af37;border:none;font-weight:900">Login Pi</button><span id="cnt" style="background:#d4af37;color:#000;padding:4px 8px;border-radius:12px;font-size:10px">17</span></div>
<div id="grid" style="display:grid;grid-template-columns:1fr 1fr"></div>
<script>
Pi.init({version:"2.0",sandbox:true});let u=null;document.getElementById('loginBtn').onclick=()=>Pi.authenticate(["username","payments"],{onIncompletePaymentFound:()=>{}}).then(a=>{u=a.user;loginBtn.innerText="✅ "+a.user.username});
fetch('https://api.github.com/repos/Ndhlovu36/revealed-logistics/contents').then(r=>r.json()).then(files=>{
 let imgs=files.filter(f=>f.name.match(/\.jpe?g|\.png/i)).sort((a,b)=>a.name.localeCompare(b.name));
 document.getElementById('cnt').innerText=imgs.length+" FLEETS"; let grid=document.getElementById('grid');
 let names=["Side Tipper","Tautliner","Flat Deck","Abnormal","Fuel Tank","Refrigerated","Box Body","Dropside","Heavy Tow","Light Tow","Cement Fixed","Chemical","Animal","Gas LPG","Water Bowser","Furniture","Cement Silo - 3 Trucks"];
 imgs.forEach((f,i)=>{let price=[6,5,5,8,6,7,4,4,8,5,6,7,6,7,5,4,6][i]||5; let d=document.createElement('div');d.className='fleet-card';d.innerHTML=`<img src="${f.name}"><div style="padding:5px"><b style="font-size:10px">${i+1}. ${names[i]||'Fleet '+(i+1)}</b><br><button class="btn" onclick="hire('${names[i]}',${price})">${price} Pi</button></div>`;grid.appendChild(d);});
});
function hire(n,p){if(!u){alert('Login Pi first');return;}Pi.createPayment({amount:p,memo:n.slice(0,70),metadata:{fleet:n}},{onReadyForServerApproval:id=>fetch("/api/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:id})}),onReadyForServerCompletion:(id,tx)=>{alert(`✅ ${n} ${p} Pi TX:${tx}`);window.open(`https://wa.me/27607263726?text=${encodeURIComponent(n+" "+p+" Pi TX:"+tx)}`,"_blank")},onCancel:()=>{},onError:e=>alert(e)})}
</script></body></html>
