<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REVEALED LOGISTICS - Pay with Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f5f6fa}
.head{background:#0a1931;color:#d4af37;padding:20px;text-align:center;font-size:22px;font-weight:bold}
.wrap{padding:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.truck{background:white;border:2px solid #d4af37;border-radius:12px;padding:12px;text-align:center}
.btn{width:100%;background:#d4af37;color:#000;border:none;padding:11px;border-radius:8px;font-weight:bold;font-size:15px;margin-top:8px}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
.login{width:100%;padding:12px;background:#0a1931;color:#d4af37;border:none;border-radius:8px;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<div class="head">🚚 REVEALED LOGISTICS<br><span style="font-size:13px;color:#fff;font-weight:normal">Durban to All SA - Pay with Pi</span></div>
<div class="wrap">
<input id="from" value="Durban">
<input id="to" placeholder="To: e.g. Johannesburg">

<button class="login" onclick="login()">Login with Pi</button>
<div id="user" style="text-align:center;color:green;margin:6px;font-weight:bold"></div>

<div class="grid" style="margin-top:15px">
<div class="truck"><h3>Tautliner<br>15 Pi</h3><button class="btn" onclick="pay(15,'Tautliner')">Book 15 Pi</button></div>
<div class="truck"><h3>Reefer<br>20 Pi</h3><button class="btn" onclick="pay(20,'Reefer')">Book 20 Pi</button></div>
<div class="truck"><h3>Side Tipper<br>18 Pi</h3><button class="btn" onclick="pay(18,'Side Tipper')">Book 18 Pi</button></div>
<div class="truck"><h3>Tanker<br>25 Pi</h3><button class="btn" onclick="pay(25,'Tanker')">Book 25 Pi</button></div>
<div class="truck"><h3>Flatbed<br>12 Pi</h3><button class="btn" onclick="pay(12,'Flatbed')">Book 12 Pi</button></div>
<div class="truck"><h3>Superlink<br>22 Pi</h3><button class="btn" onclick="pay(22,'Superlink')">Book 22 Pi</button></div>
</div>
<div style="text-align:center;margin-top:15px;font-size:11px">Dev: Ndhlovu36 | dumandhlovu361@gmail.com</div>
</div>

<script>
Pi.init({version:"2.0", sandbox:false});
let currentUser = null;

function onIncompletePaymentFound(payment){
  console.log("Incomplete payment found:", payment);
  // You should send this to your server to complete
  return;
}

function login(){
  Pi.authenticate(['username','payments'], onIncompletePaymentFound).then(function(auth){
    currentUser = auth.user;
    document.getElementById('user').innerText = "Welcome: " + currentUser.username;
  }).catch(function(e){
    alert("Auth failed: " + e.message);
  });
}

function pay(amount, truck){
  let to = document.getElementById('to').value;
  if(!to){ alert("Enter destination To!"); return; }
  if(!currentUser){ alert("Please Login with Pi first!"); login(); return; }

  let from = document.getElementById('from').value;

  Pi.createPayment({
    amount: amount,
    memo: truck + " " + from + "->" + to,
    metadata: {truck: truck, from: from, to: to, user: currentUser.username}
  },{
    onReadyForServerApproval: function(paymentId){
      console.log("Ready for approval: " + paymentId);
      alert("Payment " + paymentId + " awaiting approval...\n(In production approve on server)");
    },
    onReadyForServerCompletion: function(paymentId, txid){
      alert("SUCCESS! "+truck+" booked!\n"+from+" -> "+to+"\nTxID: "+txid);
    },
    onCancel: function(paymentId){ alert("Payment cancelled"); },
    onError: function(error, payment){ alert("Error: " + error.message); }
  });
}
</script>
</body>
</html>
