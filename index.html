<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REVEALED LOGISTICS - 90+ CITIES</title>
<style>
body{background:#001a4d;color:#fff;font-family:Arial;padding:10px;text-align:center}
.inp{width:92%;padding:14px;margin:6px;border-radius:12px;border:0}
.sel{width:95%;padding:12px;margin:6px;border-radius:10px;border:0;background:#fff;font-weight:bold}
.btn{padding:14px;border-radius:12px;border:0;font-weight:bold;width:95%;margin:6px;font-size:16px}
.status{background:#000;padding:14px;border-radius:10px;margin:10px;font-size:13px}
.dist-box{background:#fff;color:#000;padding:14px;border-radius:12px;margin:10px;display:none;text-align:left}
.price-big{font-size:28px;background:gold;color:#001a4d;padding:10px;border-radius:10px;display:inline-block;font-weight:bold}
.fleet{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px}
.card{background:#fff;color:#000;border-radius:14px;overflow:hidden;padding-bottom:8px;border:4px solid transparent}
.card img{width:100%;height:90px;object-fit:cover}.card.selected{border-color:gold}
.email-box{background:#ffeb3b;color:#000;padding:14px;border-radius:10px;margin:15px 10px;font-weight:bold}
</style>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
<h2>REVEALED LOGISTICS - 90+ CITIES</h2>
<button class="btn" id="loginBtn" style="background:#fff;color:#000" disabled>Loading Pi SDK...</button>
<div id="status" class="status">Step 10: Waiting for Pi SDK...</div>

<datalist id="saCities"><option value="Johannesburg"><option value="Pretoria"><option value="Durban"><option value="Cape Town"><option value="Midrand"><option value="Sandton"><option value="Polokwane"><option value="Bloemfontein"><option value="Gqeberha"><option value="East London"><option value="Mbombela"><option value="Rustenburg"><option value="Kimberley"><option value="Pinetown"><option value="Pietermaritzburg"><option value="Stellenbosch"><option value="George"><option value="Witbank"><option value="Centurion"><option value="Soweto"><option value="Boksburg"><option value="Benoni"><option value="Welkom"><option value="Tzaneen"><option value="Upington"><option value="Mthatha"><option value="Mahikeng"><option value="Klerksdorp"><option value="Newcastle"><option value="Ballito"><option value="Knysna"><option value="Mossel Bay"></datalist>
<input id="pickup" class="inp" list="saCities" placeholder="Pickup city" oninput="updateQuote()">
<input id="drop" class="inp" list="saCities" placeholder="Drop city" oninput="updateQuote()">
<div style="background:#002366;padding:12px;border-radius:12px;margin:10px;border:2px solid gold"><b>⚖️ Tons</b><br><select id="tons" class="sel" onchange="updateQuote()"><option value="">-- Select --</option><option value="1">1T</option><option value="5">5T</option><option value="10">10T</option><option value="20">20T</option><option value="34" selected>34T Full</option><option value="50">50T Abnormal</option></select></div>
<div id="distBox" class="dist-box"></div>
<div class="fleet">
<div class="card" onclick="selectFleet(this,'Side Tipper 34T',0.0045,8,34)"><img src="IMG-20260918-WA0397.jpg"><b>Side Tipper</b><br>34T</div>
<div class="card" onclick="selectFleet(this,'Flat Deck 34T',0.0038,6,34)"><img src="IMG-20260916-WA8594.jpg"><b>Flat Deck</b><br>34T</div>
<div class="card" onclick="selectFleet(this,'Side Curtain 30T',0.0035,5,30)"><img src="IMG-20260916-WA7873.jpg"><b>Side Curtain</b><br>30T</div>
<div class="card" onclick="selectFleet(this,'Panel Van 1.5T',0.0018,1.2,1.5)"><img src="IMG-20260916-WA9084.jpg"><b>Panel Van</b><br>1.5T</div>
<div class="card" onclick="selectFleet(this,'Abnormal Load 60T',0.008,12,60)"><img src="IMG-20260916-WA2791.jpg"><b>Abnormal Load</b><br>60T</div>
<div class="card" onclick="selectFleet(this,'Refrigerated 28T',0.005,7,28)"><img src="IMG-20260916-WA1910.jpg"><b>Refrigerated</b><br>28T</div>
<div class="card" onclick="selectFleet(this,'Fuel Tanker 34T',0.006,9,34)"><img src="IMG-20260916-WA0687.jpg"><b>Fuel Tanker</b><br>34T</div>
<div class="card" onclick="selectFleet(this,'8th Fleet 34T',0.004,6,34)"><img src="IMG-20260918-WA0397.jpg"><b>8th Fleet</b><br>34T</div>
</div>
<input type="hidden" id="truck"><input type="hidden" id="truckRate"><input type="hidden" id="truckBase"><div id="actionBar" style="display:none"><button class="btn" style="background:#ff3b3b;color:#fff;width:48%" onclick="cancelQuote()">❌ Cancel</button><button class="btn" style="background:gold;color:#000;width:48%" onclick="pay()">💳 Pay Pi</button></div>
<div class="email-box">📧 revealed.logistics@gmail.com - All SA 90+ cities</div>

<script>
const coords={"Johannesburg":{lat:-26.2041,lon:28.0473},"Pretoria":{lat:-25.7479,lon:28.2293},"Durban":{lat:-29.8587,lon:31.0218},"Cape Town":{lat:-33.9249,lon:18.4241},"Midrand":{lat:-25.9987,lon:28.1284},"Sandton":{lat:-26.1061,lon:28.0567},"Polokwane":{lat:-23.9045,lon:29.4689},"Bloemfontein":{lat:-29.0852,lon:26.1596},"Gqeberha":{lat:-33.9608,lon:25.6022},"East London":{lat:-33.0153,lon:27.9116},"Mbombela":{lat:-25.4753,lon:30.9694},"Rustenburg":{lat:-25.6678,lon:27.2419},"Kimberley":{lat:-28.7282,lon:24.7499},"Pinetown":{lat:-29.8186,lon:30.8549},"Pietermaritzburg":{lat:-29.6006,lon:30.3794},"Stellenbosch":{lat:-33.9321,lon:18.8602},"George":{lat:-33.9635,lon:22.4617},"Witbank":{lat:-25.8727,lon:29.2406},"Centurion":{lat:-25.8603,lon:28.1894},"Soweto":{lat:-26.2678,lon:27.8585},"Boksburg":{lat:-26.2114,lon:28.2578},"Welkom":{lat:-27.9837,lon:26.7341},"Tzaneen":{lat:-23.8323,lon:30.1611},"Upington":{lat:-28.4472,lon:21.256},"Mthatha":{lat:-31.5886,lon:28.7841},"Mahikeng":{lat:-25.8602,lon:25.6403},"Klerksdorp":{lat:-26.8521,lon:26.6665},"Newcastle":{lat:-27.7577,lon:29.9271},"Ballito":{lat:-29.5396,lon:31.2136},"Knysna":{lat:-34.0363,lon:23.0474},"Mossel Bay":{lat:-34.1806,lon:22.1463}};
function hav(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
let user=null,sel=null,curPrice=0,lastKm=0,piReady=false;

// STEP 10 FIX: Wait for SDK, don't freeze
async function initStep10(){
  try{
    Pi.init({version:"2.0", sandbox:true});
    piReady=true;
    document.getElementById('loginBtn').disabled=false;
    document.getElementById('loginBtn').innerText="🔐 Login with Pi - TAP";
    document.getElementById('loginBtn').onclick=login;
    document.getElementById('status').innerText="✅ Pi SDK ready for Step 10 - 90+ cities loaded - Tap Login";
  }catch(e){
    document.getElementById('status').innerText="Pi init failed: "+e.message;
  }
}
function onIncomplete(p){return fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:p.identifier,txid:p.transaction.txid})});}
function selectFleet(el,n,r,b,m){if(sel)sel.classList.remove('selected');el.classList.add('selected');sel=el;document.getElementById('truck').value=n;document.getElementById('truckRate').value=r;document.getElementById('truckBase').value=b;updateQuote();}
function updateQuote(){let pu=document.getElementById('pickup').value.trim(),dr=document.getElementById('drop').value.trim(),tons=parseFloat(document.getElementById('tons').value)||34,tr=document.getElementById('truck').value,rate=parseFloat(document.getElementById('truckRate').value)||0.0045,base=parseFloat(document.getElementById('truckBase').value)||8,box=document.getElementById('distBox'),bar=document.getElementById('actionBar');if(!pu||!dr||!coords[pu]||!coords[dr])return;let km=Math.round(hav(coords[pu],coords[dr])*1.28);lastKm=km;let price=Math.round((base+km*rate+tons*0.12)*100)/100;curPrice=price;window.currentPrice=price;box.style.display='block';bar.style.display='block';box.innerHTML=`📏 <b>${pu} → ${dr}</b> = <b>${km}km</b><br>⚖️ ${tons}T | ${tr||'Tap truck'}<br><span class="price-big">💰 π ${price}</span>`;}
function cancelQuote(){document.getElementById('pickup').value='';document.getElementById('drop').value='';if(sel)sel.classList.remove('selected');sel=null;document.getElementById('distBox').style.display='none';document.getElementById('actionBar').style.display='none';}
async function login(){if(!piReady){document.getElementById('status').innerText="SDK not ready - wait 2 sec";return;}let btn=document.getElementById('loginBtn');btn.innerText="Connecting Step 10...";try{const auth=await Pi.authenticate(['username'],onIncomplete);user=auth.user;btn.innerText="✅ "+user.username;document.getElementById('status').innerText="✅ Login OK Step 10: "+user.username;}catch(e){btn.innerText="🔐 Login Retry";document.getElementById('status').innerText="Login error: "+e.message;}}
async function pay(){if(!user){alert('Login first in Step 10');return;}await Pi.authenticate(['username','payments'],onIncomplete);Pi.createPayment({amount:curPrice,memo:`${document.getElementById('tons').value}T ${document.getElementById('truck').value}`.slice(0,80),metadata:{km:lastKm}},{onReadyForServerApproval:async pid=>{await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid})})},onReadyForServerCompletion:async(pid,txid)=>{await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid,txid:txid})});document.getElementById('status').innerText=`✅ Paid π ${curPrice}! Step 10 DONE`;},onCancel:()=>{},onError:e=>{document.getElementById('status').innerText="Error "+e;}});}

window.addEventListener('load', initStep10);
</script>
</body>
</html>
