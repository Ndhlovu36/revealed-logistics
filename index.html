<style>

<div id="piStatus" style="color:#ffcc00;font-weight:bold;padding:6px">Init Pi...</div>

<label>Dropoff Address *</label><input id="dropAddress">

</div>
<script>
let sel="",price=0.2,user=null,km=0,currentNet=localStorage.getItem('net')||'mainnet';
let lastPending=null;

function initPi(isTest){
 try{
  if(typeof Pi==='undefined'){
    document.getElementById('piStatus').innerText='⚠️ Pi SDK not loaded - Open in Pi Browser';
    document.getElementById('piStatus').style.background='#880000';
    return false;
  }
  Pi.init({version:"2.0",sandbox:isTest});
  document.getElementById('piStatus').innerText="✅ Pi Ready - "+(isTest?"TESTNET":"MAINNET")+" - Tap Login";
  document.getElementById('piStatus').style.background=isTest?"#ff8c00":"#004400";
  return true;
 }catch(e){
  document.getElementById('piStatus').innerText='Pi Error: '+e.message;
  return false;
 }
}
function setNet(n){
 currentNet=n; localStorage.setItem('net',n);
 initPi(n==='testnet');
 document.getElementById('bMain').className=n==='mainnet'?'active':'';
 document.getElementById('bTest').className=n==='testnet'?'active':'';
 document.getElementById('stat').innerText="Switched to "+n+" - Login again";
 user=null; lastPending=null;
}
setTimeout(()=>initPi(currentNet==='testnet'),800);

async function clearPending(){
 const s=document.getElementById('stat');
 if(!lastPending){ s.innerText='No pending payment stored. To force clear: Close Pi Browser fully - Swipe it away from recent apps - Then reopen Pi Browser, open your site again, and tap Login Pi. Pi will auto-detect pending and I will clear it.'; return; }
 s.innerText='Clearing '+lastPending.identifier+'...';
 try{
  if(lastPending.transaction && lastPending.transaction.txid){
    await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:lastPending.identifier,txid:lastPending.transaction.txid})});
    s.innerText='✅ Sent Complete for old TX - NOW CLOSE Pi Browser FULLY (swipe away) and reopen - then Login again';
  }else{
    await fetch('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:lastPending.identifier})});
    s.innerText='✅ Sent Cancel for old payment - NOW CLOSE Pi Browser FULLY and reopen - then Login again';
  }
 }catch(e){ s.innerText='Clear attempted but API error: '+e.message+' - Still CLOSE Pi Browser fully and try again'; }
}

async function loginPi(){
 const s=document.getElementById('stat');
 if(typeof Pi==='undefined'){ s.innerText='Pi not found - open in Pi Browser'; return; }
 s.innerText='🔄 Logging in - If freezes 5 sec, tap red Clear button...';
 // timeout to prevent freeze
 let timedOut=false;
 const timeout=setTimeout(()=>{ timedOut=true; s.innerText='⏳ Login hanging - Found pending payment blocking you. Tap RED Clear button above, then CLOSE Pi Browser fully (swipe away) and reopen.'; },5000);

 const onIncomplete=(payment)=>{
  lastPending=payment;
  clearTimeout(timeout);
  s.innerHTML='⚠️ Found PENDING payment blocking login:<br>ID:'+payment.identifier.slice(0,12)+'...<br>TX:'+(payment.transaction?payment.transaction.txid.slice(0,12):'none')+'<br><b>Fix: Tap RED Clear button above, then CLOSE Pi Browser fully and reopen.</b>';
  console.log('Pending:',payment);
  // auto try clear
  if(payment.transaction && payment.transaction.txid){
    fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:payment.identifier,txid:payment.transaction.txid})}).then(()=>{s.innerText+=' [Auto-Complete Sent - Now close Pi Browser fully]';});
  }else{
    fetch('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:payment.identifier})}).then(()=>{s.innerText+=' [Auto-Cancel Sent - Now close Pi Browser fully]';});
  }
 };

 try{
  const auth=await Pi.authenticate(['username','payments'],onIncomplete);
  clearTimeout(timeout);
  if(timedOut) return;
  user=auth.user;
  document.getElementById('puser').value=user.username;
  document.getElementById('piStatus').innerText="✅ "+user.username;
  s.innerText="✅ Login OK "+user.username+" - Ready to Pay";
 }catch(e){
  clearTimeout(timeout);
  s.innerText="Login error: "+e.message+" - If it says pending, use Red Clear button, then close Pi Browser fully";
  console.error(e);
 }
}

const cities={"johannesburg":[-26.2041,28.0473],"sandton":[-26.1065,28.0567],"soweto":[-26.2678,27.8585],"midrand":[-25.9915,28.1265],"centurion":[-25.8608,28.1891],"pretoria":[-25.7479,28.2293],"cape town":[-33.9249,18.4241],"durban":[-29.8587,31.0218],"gqeberha":[-33.9608,25.6022],"east london":[-33.0153,27.9116],"bloemfontein":[-29.0852,26.1596],"kimberley":[-28.7282,24.7499],"polokwane":[-23.9045,29.4689],"nelspruit":[-25.4753,30.9694],"rustenburg":[-25.6677,27.2419],"nairobi":[-1.2921,36.8219],"mombasa":[-4.0435,39.6682],"kisumu":[-0.0917,34.768],"kampala":[0.3476,32.5825],"kigali":[-1.9706,30.1044],"dar es salaam":[-6.7924,39.2083],"arusha":[-3.3869,36.6829],"dodoma":[-6.1722,35.7395],"zanzibar":[-6.1659,39.2026],"addis ababa":[9.03,38.74],"djibouti":[11.5721,43.1456],"lagos":[6.5244,3.3792],"abuja":[9.0765,7.3986],"kano":[12.0022,8.592],"ibadan":[7.3775,3.947],"accra":[5.6037,-0.187],"kumasi":[6.6885,-1.6244],"abidjan":[5.36,-4.0083],"dakar":[14.7167,-17.4677],"bamako":[12.6392,-8.0029],"ouagadougou":[12.3714,-1.5197],"conakry":[9.6412,-13.5784],"freetown":[8.4657,-13.2317],"monrovia":[6.3005,-10.7969],"lome":[6.1725,1.2314],"cotonou":[6.3703,2.3912],"niamey":[13.5116,2.1254],"kinshasa":[-4.4419,15.2663],"brazzaville":[-4.2634,15.2429],"yaounde":[3.848,11.5021],"douala":[4.0511,9.7679],"libreville":[0.4162,9.4673],"luanda":[-8.839,13.2894],"cairo":[30.0444,31.2357],"alexandria":[31.2001,29.9187],"casablanca":[33.5898,-7.6039],"marrakech":[31.6295,-7.9811],"rabat":[34.0209,-6.8416],"tunis":[36.8065,10.1815],"algiers":[36.7525,3.042],"tripoli":[32.8872,13.1913],"khartoum":[15.5007,32.5599],"gaborone":[-24.6282,25.9231],"windhoek":[-22.5609,17.0658],"maseru":[-29.3158,27.4869],"harare":[-17.8292,31.052],"bulawayo":[-20.1486,28.5903],"lusaka":[-15.4067,28.2871],"maputo":[-25.9692,32.5732],"lilongwe":[-13.9631,33.7741],"antananarivo":[-18.8792,47.5079]};
function hav(a,b,c,d){var R=6371;var dLat=(c-a)*Math.PI/180;var dLon=(d-b)*Math.PI/180;var x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function findCity(n){n=n.toLowerCase().trim();if(cities[n])return cities[n];for(var k in cities){if(n.includes(k)||k.includes(n))return cities[k];}return null;}
function calc(){var p=document.getElementById('pick').value.toLowerCase().trim();var d=document.getElementById('drop').value.toLowerCase().trim();var box=document.getElementById('calcBox');if(!sel){box.innerHTML="Tap HIRE first";return 0}if(!p||!d){box.innerHTML="Truck: <b>"+sel+"</b><br>Enter Pickup & Drop City";return 0}var pk=findCity(p);var dk=findCity(d);if(pk&&dk){km=Math.round(hav(pk[0],pk[1],dk[0],dk[1])*1.32);if(km<30)km=30;}else{km=380;}var tot=price*km/100;tot=parseFloat(tot.toFixed(4));box.innerHTML="Truck: <b>"+sel+"</b><br>"+p+" -> "+d+"<br>Distance: <b>"+km+" km</b><br><span style='font-size:22px;color:#ffcc00'>TOTAL: Pi "+tot+"</span>";return tot;}
var dl=document.getElementById('africaList');Object.keys(cities).sort().forEach(function(c){var o=document.createElement('option');o.value=c.charAt(0).toUpperCase()+c.slice(1);dl.appendChild(o);});
const fleet=["Side Tippers","Flat Decks","Fuel Tanker","Refrigerated","Lowbed","Flat Deck","Side Curtain","Tautliner","Van","Flat Bed"];
const images=["IMG-20260927-WA7926.jpg","IMG-20260927-WA2466.jpg","IMG-20260916-WA0687.jpg","IMG-20260916-WA1910.jpg","IMG-20260916-WA2791.jpg","IMG-20260916-WA6953.jpg","IMG-20260916-WA7873.jpg","IMG-20260916-WA8594.jpg","IMG-20260916-WA9084.jpg","IMG-20260924-WA8680.jpg"];
const g=document.getElementById('grid');
fleet.forEach(function(name,i){
 var card=document.createElement('div');card.className='card';
 var img=document.createElement('img');img.src=images[i];img.alt=name;
 img.onerror=function(){this.src='https://via.placeholder.com/400x180/001a4d/ffcc00?text='+encodeURIComponent(name);};
 var info=document.createElement('div');info.style.padding='10px';
 var b=document.createElement('b');b.innerText=name;
 var btn=document.createElement('button');btn.className='btn';btn.innerText='Hire '+name;
 btn.onclick=function(){hire(name);};
 info.appendChild(b);info.appendChild(document.createElement('br'));info.appendChild(document.createTextNode('0.2 Pi/100km'));info.appendChild(document.createElement('br'));info.appendChild(btn);
 card.appendChild(img);card.appendChild(info);g.appendChild(card);
});
function hire(n){sel=n;localStorage.setItem('sel',n);document.getElementById('stat').innerText="✅ Selected "+n+" - fill cities";calc();document.getElementById('calcBox').scrollIntoView({behavior:'smooth'});}
["clientName","clientPhone","clientEmail","pick","pickAddress","drop","dropAddress","date","puser"].forEach(function(id){var el=document.getElementById(id);if(!el)return;var v=localStorage.getItem(id);if(v)el.value=v;el.addEventListener('input',function(e){localStorage.setItem(id,e.target.value);if(id=='pick'||id=='drop')calc();});});
async function payPi(){
 var cn=document.getElementById('clientName').value.trim();var cp=document.getElementById('clientPhone').value.trim();var ce=document.getElementById('clientEmail').value.trim();var pickup=document.getElementById('pick').value.trim();var pickAddr=document.getElementById('pickAddress').value.trim();var drop=document.getElementById('drop').value.trim();var dropAddr=document.getElementById('dropAddress').value.trim();var date=document.getElementById('date').value;
 if(!sel){alert('Tap Hire first');return}if(!cn||!cp||!ce){alert('Enter Client details');return}if(!pickup||!pickAddr||!drop||!dropAddr||!date){alert('Fill all fields');return}if(typeof Pi==='undefined'||!user){document.getElementById('stat').innerText='Login Pi first';await loginPi();if(!user)return}
 var tot=calc();document.getElementById('stat').innerText="Creating payment Pi "+tot+"...";
 try{await Pi.createPayment({amount:tot,memo:("REVEALED "+sel+" "+pickup+"->"+drop).substring(0,28),metadata:{clientName:cn,clientPhone:cp,clientEmail:ce,pickupCity:pickup,pickupAddress:pickAddr,dropCity:drop,dropAddress:dropAddr,date:date,truck:sel,distance:km,network:currentNet,companyEmail:"revealed.logistics@gmail.com",reg:"2024/163979/07",panAfrica:true}},{
  onReadyForServerApproval:function(id){document.getElementById('stat').innerText="Approving "+id+"...";fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})}).then(r=>r.json()).then(()=>{document.getElementById('stat').innerText="Approved - Confirm in wallet";});},
  onReadyForServerCompletion:function(id,txid){document.getElementById('stat').innerText="PAID ✅ Pi "+tot+" TX:"+txid;fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,txid:txid,clientEmail:ce,clientName:cn,pickupAddress:pickAddr,dropAddress:dropAddr})});},
  onCancel:function(){document.getElementById('stat').innerText="Cancelled";},
  onError:function(e){document.getElementById('stat').innerText="Error "+e.message;}
 });}catch(e){document.getElementById('stat').innerText="Error "+e.message;}
}
