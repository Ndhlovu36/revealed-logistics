<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REVEALED LOGISTICS - 17 REAL TRUCKS</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:Arial, sans-serif;margin:0;background:#f5f7fb}
header{background:#001a4d;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:20}
.hero{background:#ffcc00;color:#001a4d;padding:12px;text-align:center;font-weight:bold;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;padding:14px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.card img{width:100%;height:210px;object-fit:cover;background:#ddd}
.card-body{padding:12px}
.btn{width:100%;background:#001a4d;color:#fff;border:none;padding:11px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:6px}
.quote{background:#fff;margin:14px;padding:16px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
input{width:100%;padding:11px;margin:7px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
#piStatus{color:#ffcc00;margin:6px 0;font-weight:bold}
</style>
</head>
<body>
<header>
<h2 style="margin:0">REVEALED LOGISTICS</h2>
<div id="piStatus">Not logged in - Login to pay with Pi</div>
<button onclick="loginWithPi()" style="background:#ffcc00;color:#001a4d;border:none;padding:8px 16px;border-radius:8px;font-weight:bold;cursor:pointer">🔐 Login with Pi</button>
</header>

<div class="hero">17 REAL TRUCKS CORRECT PICTURES - HUGE FLEET UPDATED</div>

<div class="grid" id="fleetGrid"></div>

<div class="quote">
<h3>Get Instant Quote & Pay with Pi</h3>
<input id="pickupPoint" placeholder="Pickup - e.g. Bloemfontein">
<input id="dropPoint" placeholder="Drop - e.g. Johannesburg">
<input id="piUser" placeholder="Pi Username (auto after login)">
<div id="calcRes" style="font-weight:bold;margin:10px 0;color:#001a4d">Select a truck - Tap Hire</div>
<button class="btn" onclick="quote()" style="background:#ff8c00">Request Quote & Pay with Pi - π</button>
<div id="status" style="margin-top:12px;font-weight:bold"></div>
</div>

<script>
const Pi = window.Pi;
Pi.init({ version: "2.0", sandbox: false });
let selName = "", selPrice = 0;
let user = null;
function onIncomplete(p){ console.log(p); }

async function loginWithPi(){
 try{
  const a = await Pi.authenticate(['username','payments'], onIncomplete);
  user = a.user;
  document.getElementById('piStatus').innerText = "Welcome " + user.username + " ✅ Pi Ready";
  document.getElementById('piUser').value = user.username;
 }catch(e){ alert("Pi login failed: " + e.message); }
}

// 17 FLEET - WITH YOUR 2 HUGE NEW IMAGES AT TOP
const fleet = [
 {name:"Side Tipper Double - Huge Fleet (7 Trucks)", file:"IMG-20260927-WA7926.jpg", price:5},
 {name:"Flat Deck - Huge Fleet (7 Trucks)", file:"IMG-20260927-WA2466.jpg", price:6},
 {name:"Tautliner", file:"IMG-20260916-WA5229.jpg", price:5},
 {name:"Flat Deck Single", file:"IMG-20260916-WA6953.jpg", price:6},
 {name:"Refrigerated Truck", file:"IMG-20260924-WA5738.jpg", price:7},
 {name:"Fuel Tanker", file:"IMG-20260924-WA5740.jpg", price:6},
 {name:"Abnormal Load", file:"IMG-20260924-WA5741.jpg", price:8},
 {name:"Tri Axle", file:"IMG-20260924-WA5742.jpg", price:5},
 {name:"Superlink", file:"IMG-20260924-WA5743.jpg", price:5},
 {name:"Drop Side 8 Ton", file:"IMG-20260916-WA5230.jpg", price:4},
 {name:"Drop Side 12 Ton", file:"IMG-20260916-WA5231.jpg", price:4.5},
 {name:"Horse and Trailer", file:"IMG-20260916-WA5232.jpg", price:5.5},
 {name:"22 Seater Bus", file:"IMG-20260916-WA5233.jpg", price:3},
 {name:"65 Seater Bus", file:"IMG-20260916-WA5234.jpg", price:6},
 {name:"Construction Tipper", file:"IMG-20260916-WA5235.jpg", price:5},
 {name:"Lowbed Trailer", file:"IMG-20260916-WA5236.jpg", price:9},
 {name:"Refrigerated 8 Ton", file:"IMG-20260916-WA5237.jpg", price:7}
];

const g = document.getElementById('fleetGrid');
fleet.forEach(f=>{
 let d = document.createElement('div'); d.className='card';
 d.innerHTML = `<img src="${f.file}" onerror="this.src='https://via.placeholder.com/400x210?text=${encodeURIComponent(f.name)}'"><div class="card-body"><b>${f.name}</b><br>From π ${f.price}<br><button class="btn" onclick="hire('${f.name}',${f.price})">Hire ${f.name}</button></div>`;
 g.appendChild(d);
});

function hire(name, price){
 selName = name; selPrice = price;
 let pickup = document.getElementById('pickupPoint').value || "Bloemfontein";
 let drop = document.getElementById('dropPoint').value || "Johannesburg";
 document.getElementById('calcRes').innerText = `Price: π ${price} - ${name} | ${pickup} → ${drop}`;
 document.getElementById('status').innerText = `Selected: ${name} - Fill pickup/drop and Pay`;
 window.scrollTo(0, document.body.scrollHeight);
}
function status(t){ document.getElementById('status').innerText = t; }

function quote(){
 let pickup = document.getElementById('pickupPoint').value;
 let drop = document.getElementById('dropPoint').value;
 let piU = document.getElementById('piUser').value;
 if(!selName){ alert("Tap Hire on a truck first"); return; }
 if(!pickup || !drop){ alert("Enter Pickup and Drop"); return; }
 if(!piU){ loginWithPi(); return; }

 Pi.createPayment({
  amount: selPrice,
  memo: `REVEALED LOGISTICS - ${selName} ${pickup} to ${drop}`,
  metadata: { truck: selName, pickup: pickup, drop: drop }
 },{
  onReadyForServerApproval: function(id){
   fetch('/api/complete',{method:'POST',body:JSON.stringify({paymentId:id})}).catch(()=>{});
  },
  onReadyForServerCompletion: function(id, txid){
   status(`✅ PAID π ${selPrice} TX ${txid} - Order Sent`);
   let txt = `REVEALED LOGISTICS - PAYMENT DONE\nTruck: ${selName}\nFrom: ${pickup}\nTo: ${drop}\nAmount: π ${selPrice}\nPi User: ${piU}\nTX: ${txid}`;
   setTimeout(()=>{
    let subj = encodeURIComponent('New Order Paid ' + selName);
    let body = encodeURIComponent(txt);
    window.location.href = `mailto:revealedlogistics@gmail.com?subject=${subj}&body=${body}`;
   }, 1200);
  },
  onCancel: function(){ status("❌ Payment Cancelled"); },
  onError: function(e){ status("❌ Error " + e.message); }
 });
}
</script>
</body>
</html>
