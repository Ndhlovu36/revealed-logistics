<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REVEALED LOGISTICS</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><style>body{font-family:Arial;padding:15px;background:#f5f5f5}.card{background:#fff;padding:20px;border-radius:12px;max-width:500px;margin:auto}input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold}.btn-y{background:#ffeb3b}.btn-b{background:#000;color:#fff;margin-top:10px}</style></head><body><div class="card"><h2>Get Instant Quote</h2><p id="u">Not logged in</p><button class="btn btn-y" onclick="login()">Login with Pi</button><input id="from" placeholder="From City"><input id="to" placeholder="To City"><select id="type"><option>Parcel</option><option>Documents</option><option>Furniture</option></select><input id="phone" placeholder="Phone"><button class="btn btn-b" onclick="pay()">Get Quote for 1 Pi</button></div><script>
const Pi=window.Pi;Pi.init({version:"2.0",sandbox:false});let user=null;
function onIncomplete(p){console.log(p)}
async function login(){try{const a=await Pi.authenticate(['username','payments'],onIncomplete);user=a.user;document.getElementById('u').innerText="Hi "+user.username}catch(e){alert(e.message)}}
async function pay(){
if(!user){alert("Login first");return}
const from=document.getElementById('from').value;const to=document.getElementById('to').value;
if(!from||!to){alert("Enter From/To");return}
try{await Pi.createPayment({amount:1,memo:"Logistics "+from+" to "+to,metadata:{from,to}},{onReadyForServerApproval:async(id)=>{await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})})},onReadyForServerCompletion:async(id,txid)=>{await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,txid:txid})});alert("Success! Quote sent.")},onCancel:()=>{},onError:(e)=>{alert(e.message)}})}catch(e){alert(e.message)}
}
</script></body></html>
