<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REVEALED v17 - SDK FIXED</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>body{font-family:Arial;margin:0;background:#f0f2f5}header{background:#001a4d;color:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:99}
.card{background:#fff;border-radius:12px;overflow:hidden;margin:10px;box-shadow:0 2px 8px rgba(0,0,0,.2)}.card img{width:100%;height:180px;object-fit:cover}
.btn{width:100%;background:#001a4d;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer}
#calcBox{background:#001a4d;color:#fff;padding:14px;border-radius:10px;margin:10px 0;line-height:1.8}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:2px solid #ccc;box-sizing:border-box;font-size:16px}
.net button{padding:8px 14px;border-radius:20px;border:2px solid #ffcc00;background:transparent;color:#fff;font-weight:bold;margin:2px}
.net button.active{background:#ffcc00;color:#001a4d}</style>
</head><body>
<header>
<h2>REVEALED LOGISTICS</h2>
<div id="piStatus" style="color:#ffcc00;font-weight:bold;padding:6px">Loading...</div>
<div class="net">
<button id="bMain" class="active" onclick="setNet('mainnet')">MAINNET</button>
<button id="bTest" onclick="setNet('testnet')">TESTNET</button>
<button onclick="loginPi()" style="background:#ffcc00;color:#000;padding:8px 16px;border-radius:20px;font-weight:bold;border:none">🔐 Login Pi</button>
</div>
</header>
<div id="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;padding:10px"></div>

<div style="background:#fff;margin:12px;padding:14px;border-radius:12px;border:2px solid #001a4d">
<h3>Calculator - π0.2/100km LIVE</h3>
<input id="pick" list="cl" placeholder="Pickup e.g Gqeberha"><input id="drop" list="cl" placeholder="Drop e.g Kimberley"><datalist id="cl"></datalist>
<input id="date" type="date"><input id="puser" placeholder="Pi username">
<div id="calcBox">Tap HIRE on any truck above</div>
<button class="btn" style="background:#ff8c00;font-size:18px" onclick="payPi()">Pay with Pi - π0.2/100km</button>
<div id="stat" style="font-weight:bold;margin-top:10px;min-height:40px"></div>
<div style="margin-top:10px;font-size:13px">Screenshot shows: 775km = π1.55 ✅ Correct!</div>
</div>

<script>
let sel="", price=0.2, user=null, km=0, currentNet='mainnet';

function initPi(isTest){
 try{
  Pi.init({version:"2.0", sandbox: isTest});
  document.getElementById('piStatus').innerText = "Pi SDK Ready - "+(isTest?"TESTNET":"MAINNET")+" - Tap Login Pi";
  document.getElementById('piStatus').style.background = isTest?"#ff8c00":"#004400";
  console.log("Pi init ok test="+isTest);
  return true;
 }catch(e){
  document.getElementById('piStatus').innerText = "Pi SDK Error - Refresh in Pi Browser";
  console.error(e); return false;
 }
}
initPi(false);

async function loginPi(){
 document.getElementById('stat').innerText="Logging in...";
 // ALWAYS re-init before auth to fix SDK not initialized error
 initPi(currentNet==='testnet');
 try{
  const auth = await Pi.authenticate(['username','payments'], function(p){ console.log("incomplete",p); });
  user = auth.user;
  document.getElementById('puser').value = user.username;
  document.getElementById('piStatus').innerText = "✅ Welcome "+user.username+" - "+currentNet.toUpperCase();
  document.getElementById('piStatus').style.background="#004400";
  document.getElementById('stat').innerText="Login OK - Now pay";
 }catch(e){
  document.getElementById('stat').innerText="Login failed: "+e.message+" | Make sure you're in Pi Browser";
  document.getElementById('piStatus').innerText="❌ "+e.message+" - Try TESTNET";
 }
}

function setNet(n){
 currentNet=n;
 initPi(n==='testnet');
 document.getElementById('bMain').className = n==='mainnet'?'active':'';
 document.getElementById('bTest').className = n==='testnet'?'active':'';
 document.getElementById('stat').innerText="Switched to "+n.toUpperCase()+" - Login again";
 user=null;
 document.getElementById('piStatus').innerText="Switched to "+n.toUpperCase()+" - Tap Login Pi again";
}

const cities={"gqeberha":[-33.96,25.60],"kimberley":[-28.72,24.74],"johannesburg":[-26.20,28.04],"bloemfontein":[-29.08,26.15],"cape town":[-33.92,18.42],"durban":[-29.85,31.02],"pretoria":[-25.74,28.22],"polokwane":[-23.90,29.46],"east london":[-33.01,27.91],"port elizabeth":[-33.96,25.60]};
const dl=document.getElementById('cl'); Object.keys(cities).forEach(c=>{let o=document.createElement('option');o.value=c.charAt(0).toUpperCase()+c.slice(1);dl.appendChild(o);});
function hav(a,b,c,d){const R=6371;const dLat=(c-a)*3.1415/180;const dLon=(d-b)*3.1415/180;const x=Math.sin(dLat/2)**2+Math.cos(a*3.1415/180)*Math.cos(c*3.1415/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function calc(){const p=document.getElementById('pick').value.toLowerCase().trim();const d=document.getElementById('drop').value.toLowerCase().trim();const dt=document.getElementById('date').value;const box=document.getElementById('calcBox');
 if(!sel){box.innerHTML="👆 Tap HIRE on any truck";return 0}
 if(!p||!d){box.innerHTML=`Truck: <b>${sel}</b><br>Enter Pickup & Drop`;return 0}
 let pk=cities[p]; let dk=cities[d]; if(!pk){for(let k in cities){if(p.includes(k)||k.includes(p))pk=cities[k]}} if(!dk){for(let k in cities){if(d.includes(k)||k.includes(d))dk=cities[k]}}
 if(pk&&dk){km=Math.round(hav(pk[0],pk[1],dk[0],dk[1])*1.32)}else{km=400}
 let tot=price*km/100; tot=parseFloat(tot.toFixed(4));
 box.innerHTML=`Truck: <b>${sel}</b><br>Route: ${p} → ${d}<br>Distance: <b>${km} km</b><br>Rate: π0.2/100km<br><span style="font-size:26px;color:#ffcc00">TOTAL: π ${tot}</span><br>Collection: ${dt||'Select date'}<br><small>Fluctuates by km - LIVE</small>`;
 return tot;
}

const fleet=[["Side Tippers","IMG-20260927-WA7926.jpg"],["Flat Decks","IMG-20260927-WA2466.jpg"],["Fuel Tanker","IMG-20260916-WA0687.jpg"],["Refrigerated","IMG-20260916-WA1910.jpg"],["Lowbed","IMG-20260916-WA2791.jpg"],["Flat Deck","IMG-20260916-WA6953.jpg"],["Side Curtain","IMG-20260916-WA7873.jpg"],["Tautliner","IMG-20260916-WA8594.jpg"],["Van","IMG-20260916-WA9084.jpg"],["Flat Bed","IMG-20260924-WA8680.jpg"]];
const g=document.getElementById('grid'); fleet.forEach((f)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<img src="${f[1]}?v=17" onerror="this.style.background='#ccc'"><div style="padding:10px"><b>${f[0]}</b><br>π0.2/100km<br><button class="btn" onclick="hire('${f[0]}')">Hire ${f[0]}</button></div>`;g.appendChild(d);});
function hire(n){sel=n;document.getElementById('stat').innerText="✅ Selected "+n;calc();document.querySelector('#calcBox').scrollIntoView({behavior:'smooth'});}
document.getElementById('pick').addEventListener('input',calc);document.getElementById('drop').addEventListener('input',calc);document.getElementById('date').addEventListener('change',calc);

async function payPi(){
 const pickup=document.getElementById('pick').value; const drop=document.getElementById('drop').value; const date=document.getElementById('date').value;
 if(!sel){alert('Tap Hire');return} if(!pickup||!drop||!date){alert('Fill Pickup, Drop, Date');return}
 if(!user){alert('Tap Login Pi first'); await loginPi(); if(!user)return}
 const tot=calc();
 document.getElementById('stat').innerText="Creating payment π"+tot+"...";
 // FIX: Re-init right before payment - solves SDK not initialized
 initPi(currentNet==='testnet');
 try{
  await Pi.createPayment({amount:tot, memo:`REVEALED ${sel} ${pickup}->${drop} ${date}`, metadata:{truck:sel, pickup, drop, date, distance:km, network:currentNet}},{
   onReadyForServerApproval:function(id){document.getElementById('stat').innerText="Approving "+id+"..."; fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})}).then(r=>{console.log("approve ok")}).catch(e=>{console.log("approve needs backend",e); document.getElementById('stat').innerText="Backend /api/approve missing - Add backend files!"})},
   onReadyForServerCompletion:function(id,txid){document.getElementById('stat').innerText=`✅ PAID π${tot} SUCCESS TX:${txid}`; fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id, txid:txid})}).catch(()=>{})},
   onCancel:function(){document.getElementById('stat').innerText="❌ Payment Cancelled"},
   onError:function(e){document.getElementById('stat').innerText="❌ "+e.message; console.error(e)}
  });
 }catch(e){document.getElementById('stat').innerText="❌ "+e.message+" - If Test user, switch to TESTNET and login again"; console.error(e)}
}
</script></body></html>
