<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REVEALED v28.4b - Clear Pending</title>
<style>
body{font-family:Arial;margin:0;background:#f0f2f5}
header{background:#001a4d;color:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:99}
.card{background:#fff;border-radius:12px;overflow:hidden;margin:8px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.card img{width:100%;height:170px;object-fit:cover}
.btn{width:100%;background:#001a4d;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer}
.btnClear{width:100%;background:#d00000;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:8px}
#calcBox{background:#001a4d;color:#fff;padding:14px;border-radius:10px;margin:10px 0}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:2px solid #ccc;box-sizing:border-box}
.net button{padding:8px 14px;border-radius:20px;border:2px solid #ffcc00;background:transparent;color:#fff;font-weight:bold;margin:2px}
.net button.active{background:#ffcc00;color:#001a4d}
label{font-size:11px;font-weight:bold;color:#001a4d;display:block;margin-top:6px}
</style></head><body>
<header>
<h2>REVEALED v28.4b - FIXED BUTTONS</h2>
<div id="piStatus" style="color:#ffcc00;font-weight:bold">✅ Ndhlovu36 Ready</div>
<div class="net">
<button id="bMain" class="active" onclick="setNet('mainnet')">MAINNET</button>
<button id="bTest" onclick="setNet('testnet')">TESTNET</button>
<button onclick="loginPi()" style="background:#ffcc00;color:#000;padding:8px 16px;border-radius:20px;font-weight:bold;border:none">Login Pi</button>
</div>
</header>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;padding:8px">
<div class="card"><div style="padding:10px"><b>Side Tippers</b><br><button class="btn" onclick="hire('Side Tippers')">Hire Side Tippers</button></div></div>
<div class="card"><div style="padding:10px"><b>Flat Decks</b><br><button class="btn" onclick="hire('Flat Decks')">Hire Flat Decks</button></div></div>
<div class="card"><div style="padding:10px"><b>Refrigerated</b><br><button class="btn" onclick="hire('Refrigerated')">Hire Refrigerated</button></div></div>
<div class="card"><div style="padding:10px"><b>Lowbed</b><br><button class="btn" onclick="hire('Lowbed')">Hire Lowbed</button></div></div>
<div class="card"><div style="padding:10px"><b>Side Curtain</b><br><button class="btn" onclick="hire('Side Curtain')">Hire Side Curtain</button></div></div>
<div class="card"><div style="padding:10px"><b>Tautliner</b><br><button class="btn" onclick="hire('Tautliner')">Hire Tautliner</button></div></div>
<div class="card"><div style="padding:10px"><b>Van</b><br><button class="btn" onclick="hire('Van')">Hire Van</button></div></div>
<div class="card"><div style="padding:10px"><b>Flat Bed</b><br><button class="btn" onclick="hire('Flat Bed')">Hire Flat Bed</button></div></div>
</div>
<div style="background:#fff;margin:12px;padding:14px;border-radius:12px;border:2px solid #001a4d">
<label>Pickup City *</label><input id="pick" list="africaList" placeholder="Meyerton">
<label>Drop City *</label><input id="drop" list="africaList" placeholder="Vereeniging">
<label>Drop Address</label><input id="dropAddress" value="69 Marray street">
<label>Qty (1-20)</label><input id="truckQty" type="number" value="3" min="1" max="20" oninput="calc()">
<datalist id="africaList"></datalist>
<div id="calcBox">Truck: Flat Bed x3<br>meyerton -> vereeniging<br>Km: 30<br>TOTAL Pi 0.1800</div>
<button class="btn" style="background:#ff8c00" onclick="payPi()">Pay Pi</button>
<button class="btnClear" onclick="clearPending()">🔴 Clear Pending Payment</button>
<div id="stat" style="background:#fff3cd;padding:10px;border-radius:8px;margin-top:8px;font-weight:bold">A pending payment needs to be handled. Tap Clear Pending.</div>
</div>
<script>
let sel="Flat Bed",price=0.2,user=null,km=30,currentNet='testnet';
function hire(n){sel=n;document.getElementById('stat').innerText="✅ "+n;calc();}
function setNet(n){currentNet=n;document.getElementById('bMain').className=n==='mainnet'?'active':'';document.getElementById('bTest').className=n==='testnet'?'active':'';try{Pi.init({version:"2.0",sandbox:n==='testnet'});}catch(e){}}
function hav(a,b,c,d){var R=6371;var dLat=(c-a)*Math.PI/180;var dLon=(d-b)*Math.PI/180;var x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
const cities={"vereeniging":[-26.6731,27.9261],"meyerton":[-26.5553,28.0187],"johannesburg":[-26.2041,28.0473]};
function findCity(n){n=n.toLowerCase();if(cities[n])return cities[n];return null;}
function calc(){let qty=parseInt(document.getElementById('truckQty').value)||1;let p=document.getElementById('pick').value.toLowerCase().trim();let d=document.getElementById('drop').value.toLowerCase().trim();let box=document.getElementById('calcBox');let pk=findCity(p);let dk=findCity(d);if(pk&&dk){km=Math.round(hav(pk[0],pk[1],dk[0],dk[1])*1.32);if(km<30)km=30;}let tot=price*km/100*qty;box.innerHTML="Truck: <b>"+sel+"</b> x"+qty+"<br>"+p+" -> "+d+"<br>Km: <b>"+km+"</b><br><span style='font-size:20px;color:#ffcc00'>TOTAL Pi "+tot.toFixed(4)+"</span>";return tot;}
async function loginPi(){try{Pi.init({version:"2.0",sandbox:currentNet==='testnet'});const a=await Pi.authenticate(['username','payments'],onIncomplete);user=a.user;document.getElementById('piStatus').innerText="✅ "+user.username;}catch(e){document.getElementById('stat').innerText=e.message;}}
function onIncomplete(payment){console.log("Incomplete",payment);document.getElementById('stat').innerHTML="⚠️ Found pending: "+payment.identifier+"<br>Tap Clear Pending RED button to complete it";return fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:payment.identifier,txid:payment.transaction?payment.transaction.txid:""})}).then(()=>{document.getElementById('stat').innerText="Pending cleared - try Pay again";});}
async function clearPending(){if(typeof Pi==='undefined'){document.getElementById('stat').innerText='Open in Pi Browser';return;}document.getElementById('stat').innerText='Checking pending...';try{Pi.init({version:"2.0",sandbox:currentNet==='testnet'});await Pi.authenticate(['username','payments'],onIncomplete);document.getElementById('stat').innerText='If pending exists, it will auto-clear. Try Pay Pi again after.';}catch(e){document.getElementById('stat').innerText='Clear error: '+e.message;}}
async function payPi(){let tot=calc();if(typeof Pi==='undefined'){alert('Open Pi Browser');return;}try{Pi.init({version:"2.0",sandbox:currentNet==='testnet'});await Pi.createPayment({amount:tot,memo:("REVEALED "+sel).substring(0,28),metadata:{truck:sel}},{onReadyForServerApproval:id=>{fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})})},onReadyForServerCompletion:(id,txid)=>{fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,txid:txid})}).then(()=>{document.getElementById('stat').innerText="PAID ✅ Pi "+tot+" TXID: "+txid;});},onCancel:()=>{document.getElementById('stat').innerText="Cancelled";},onError:e=>{document.getElementById('stat').innerText="Error "+e.message;}},onIncomplete); }catch(e){document.getElementById('stat').innerText=e.message;}}
</script>
<script>setTimeout(()=>{let s=document.createElement('script');s.src='https://sdk.minepi.com/pi-sdk.js';s.onload=()=>{Pi.init({version:"2.0",sandbox:true});document.getElementById('piStatus').innerText="✅ Ndhlovu36 - TESTNET Ready";};document.head.appendChild(s);},500);</script>
</body></html>
