<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval';">
<title>Revealed Logistics - SCANIA Fleet</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:Arial;margin:0;background:#eef2ff}
header{background:#0a3cc9;color:white;padding:22px;text-align:center}
header h1{margin:0;font-size:30px}
.grid{display:grid;grid-template-columns:1fr;gap:14px;padding:14px;max-width:1200px;margin:auto}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.card img{width:100%;height:240px;object-fit:cover;display:block;background:#ccc}
.info{padding:14px}.card h3{margin:0;color:#0a3cc9}
.btn{background:#0a3cc9;color:white;border:none;padding:12px;width:100%;border-radius:10px;font-weight:bold;margin-top:10px;cursor:pointer}
</style>
<script>
// Init Pi
Pi.init({ version: "2.0", sandbox: false });

function bookTruck(truckName) {
  if (typeof Pi === "undefined") {
    alert("Please open this in Pi Browser to book: " + truckName);
    return;
  }
  Pi.createPayment({
    amount: 1,
    memo: "Booking " + truckName + " - Revealed Logistics",
    metadata: { truck: truckName }
  }, {
    onReadyForServerApproval: function(paymentId) { console.log("Approve:", paymentId); },
    onReadyForServerCompletion: function(paymentId, txid) { alert("Booked " + truckName + "! Pi Tx: " + txid); },
    onCancel: function(paymentId) { alert("Booking cancelled"); },
    onError: function(error) { alert("Pi Payment error: " + error); }
  });
}
</script>
</head><body>
<header><h1>REVEALED LOGISTICS</h1><p>SCANIA Fleet • Delivering With Precision</p></header>
<div class="grid">
<div class="card"><img src="https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?w=800"><div class="info"><h3>SCANIA Fuel Tanker 35,000L</h3><button class="btn" onclick="bookTruck('Fuel Tanker 35kL')">Book Fuel Tanker</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=800"><div class="info"><h3>SCANIA Lowbed 60T</h3><button class="btn" onclick="bookTruck('Lowbed 60T')">Book Lowbed</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1519003722824-1942438aed5d?w=800"><div class="info"><h3>SCANIA Reefer - Cold Chain</h3><button class="btn" onclick="bookTruck('Reefer')">Book Reefer</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?w=800"><div class="info"><h3>SCANIA Tautliner Superlink</h3><button class="btn" onclick="bookTruck('Tautliner')">Book Tautliner</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1485575301923-ffab0abf66d7?w=800"><div class="info"><h3>SCANIA Tipper</h3><button class="btn" onclick="bookTruck('Tipper')">Book Tipper</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1566576912321-d58ddd7a6088?w=800"><div class="info"><h3>SCANIA Van - Last Mile</h3><button class="btn" onclick="bookTruck('Van')">Book Van</button></div></div>
</div></body></html>
