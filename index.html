<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Revealed Logistics | Test Pi Payments</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#eef4ff}
.header{background:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.1);position:sticky;top:0;z-index:99}
.logo-img{height:48px}
.hero{position:relative;height:400px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:#0a1931;overflow:hidden}
.hero img.bg{position:absolute;width:100%;height:100%;object-fit:cover;opacity:.4}
.hero-content{position:relative;z-index:2}
.btn{padding:10px 18px;border-radius:25px;font-weight:900;border:none;cursor:pointer}
.btn-blue{background:#0052cc;color:#fff}.btn-yellow{background:#ffcc00;color:#0a1931}
.section{max-width:1200px;margin:auto;padding:20px 14px}
.fleet{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:900px){.fleet{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.card img{width:100%;height:165px;object-fit:cover}
.box{background:#fff;border-radius:12px;padding:14px;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.inp{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:5px 0}
.test-badge{background:#ff4444;color:#fff;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:900;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
</style>
</head>
<body>

<div class="header">
<img src="logo-blue.png" class="logo-img" alt="Logo">
<div style="display:flex;gap:8px;align-items:center">
<span class="test-badge">TEST Pi MODE</span>
<button class="btn btn-blue" onclick="piLogin()">π Login</button>
</div>
</div>

<div class="hero">
<img class="bg" src="fleet-side-tipper-blue.jpg">
<div class="hero-content">
<img src="logo-blue.png" style="height:85px;background:#fff;padding:8px;border-radius:12px;margin-bottom:10px">
<h1>TEST Pi PAYMENTS<br><span style="color:#ffcc00">NO MAINNET • TEST ONLY</span></h1>
<p>For testing in Pi Browser - Sandbox</p>
</div>
</div>

<div class="section">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="box">
<h3>📦 Quote in Test Pi</h3>
<input id="tons" class="inp" type="number" placeholder="Tons e.g. 34">
<button class="btn btn-blue" style="width:100%" onclick="calcTestPi()">Calculate Test Pi</button>
<div id="qRes" style="color:#0052cc;font-weight:900;margin-top:8px"></div>
</div>

<div class="box" style="border:2px solid #ff4444">
<h3>🧪 Test Pi Payment</h3>
<p style="font-size:11px;color:#ff4444;font-weight:800">TESTNET MODE - Not real Pi - For testing only</p>
<input id="piAmt" class="inp" placeholder="Test Pi Amount e.g. 1.5">
<input id="ref" class="inp" placeholder="Ref: RL-TEST-001">
<button class="btn btn-blue" style="width:100%;background:#ff4444" onclick="payTestPi()">🧪 Pay with TEST Pi</button>
<div id="piStatus" style="font-size:12px;margin-top:8px"></div>
</div>
</div>
</div>

<script>
// === TEST Pi MODE - IMPORTANT ===
Pi.init({version:"2.0", sandbox:true}); // <-- TRUE = Test Pi, FALSE = Mainnet Pi

let piUser=null;
async function piLogin(){
 try{
  const auth = await Pi.authenticate(['username','payments'], onIncomplete);
  piUser=auth.user;
  document.getElementById('piStatus').innerText='Test Pi Connected: @'+auth.user.username;
  alert('Test Pi Connected: @'+auth.user.username);
 }catch(e){alert('Open this site in Pi Browser to test Test Pi payments');}
}
function onIncomplete(p){return}

function calcTestPi(){
 const t=parseFloat(document.getElementById('tons').value)||34;
 const pi=(t*0.2).toFixed(2);
 document.getElementById('qRes').innerText=t+'T = '+pi+' Test π';
 document.getElementById('piAmt').value=pi;
 document.getElementById('ref').value='RL-TEST-'+Date.now();
}

function payTestPi(){
 const amt=parseFloat(document.getElementById('piAmt').value);
 const ref=document.getElementById('ref').value||'RL-TEST-'+Date.now();
 if(!amt){alert('Enter Test Pi amount');return}
 if(!piUser){alert('Login with Pi first'); piLogin(); return}
 
 Pi.createPayment({
  amount: amt,
  memo: `Revealed Logistics TEST ${ref}`,
  metadata: {ref: ref, test:true}
 },{
  onReadyForServerApproval: function(paymentId){
   document.getElementById('piStatus').innerText='TEST Pi Approving... '+paymentId;
   console.log('Test Pi Approve needed:',paymentId);
   // In Test mode, you still need backend /api/pi/approve (can auto-approve for testing)
  },
  onReadyForServerCompletion: function(paymentId, txid){
   document.getElementById('piStatus').innerText='TEST Pi Success! TX:'+txid;
   alert('TEST Pi Paid! TX: '+txid);
  },
  onCancel: function(id){document.getElementById('piStatus').innerText='Test Pi Cancelled';},
  onError: function(err){document.getElementById('piStatus').innerText='Test Pi Error: '+err;}
 });
}
</script>
</body>
</html>
