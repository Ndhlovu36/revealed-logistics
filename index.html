function hav(a,b,c,d){let R=6371;let dLat=(c-a)*Math.PI/180;let dLon=(d-b)*Math.PI/180;let x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
