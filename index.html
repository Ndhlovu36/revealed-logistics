<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#f7f9fc}header{background:#001a4d;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:200}
header h1{color:#ffcc00;font-size:15px}.btn-pi{background:#ffcc00;color:#001a4d;padding:8px 16px;border-radius:20px;border:none;font-weight:bold}

.card{background:#fff;border:2px solid #ffcc00;border-radius:12px;overflow:hidden}

</style></head><body>
<header><h1>REVEALED LOGISTICS</h1><button class="btn-pi" onclick="doLogin()">Login Pi</button></header>
<div id="piStatus"></div>
<div class="tabs">

</div>
<div class="hero">17 REAL TRUCKS | revealed.logistics@gmail.com | +27 60 726 3726</div>
<div class="box">
<h2>📍 Cities, Distance, Quantity, Pickup / Drop</h2>
<div style="display:flex;gap:6px">
<select id="fromCity"><option>Johannesburg</option><option>Pretoria</option><option>Durban</option><option>Cape Town</option><option>Bloemfontein</option><option>Polokwane</option><option>Gqeberha</option><option>East London</option></select>

<button onclick="calc()" style="width:100%;padding:12px;background:#001a4d;color:#fff;border-radius:8px;font-weight:bold;border:none;margin-top:6px">📏 Calculate Distance & Pi Price</button>

</div>

<div class="box">
<h2>📦 Request Quote & Pay Pi</h2>
<input id="cName" placeholder="Your Full Name"><input id="cPhone" value="+27607263726"><input id="cEmail" type="email" placeholder="Your Email for CC"><textarea id="cNote" rows="2" placeholder="Note"></textarea>
<button onclick="quote()" style="width:100%;padding:14px;background:#ffcc00;font-weight:bold;border-radius:8px;border:none">Send to revealed.logistics@gmail.com + WhatsApp</button>
</div>
<a class="wa-float" href="https://wa.me/27607263726">💬</a>
<script>
let piUser=null, selName="", selPrice=0, distKm=0, mode='test';
let fleetData=[["Side Tipper",5,"IMG-20260916-WA2791.jpg"],["Tautliner",5,"IMG-20260916-WA6953.jpg"],["Flat Deck",6,"IMG-20260916-WA2791.jpg"],["Abnormal Load",8,"IMG-20260916-WA6953.jpg"],["Fuel Tank",6,"IMG-20260916-WA2791.jpg"],["Refrigerated",7,"IMG-20260916-WA6953.jpg"],["Box Body",4,"IMG-20260916-WA2791.jpg"],["Dropside",4,"IMG-20260916-WA6953.jpg"],["Tanker 32K",6,"IMG-20260916-WA2791.jpg"],["Lowbed",9,"IMG-20260916-WA6953.jpg"],["Tipper 8x4",5,"IMG-20260916-WA2791.jpg"],["Panel Van",2,"IMG-20260916-WA6953.jpg"],["Horse & Trailer",7,"IMG-20260916-WA2791.jpg"],["Crane Truck",8,"IMG-20260916-WA6953.jpg"],["Interlink",8,"IMG-20260916-WA2791.jpg"],["Superlink",9,"IMG-20260916-WA6953.jpg"],["Mixer Special",6,"IMG-20260916-WA2791.jpg"]];
function renderFleet(){let h="";fleetData.forEach((f,i)=>{h+=`<div class="card"><img src="${f[2]}" onerror="this.src='${f[2].replace('.jpg','.jpeg')}';this.onerror=function(){this.src='https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?w=400'}"><div class="card-body"><b>${i+1}. ${f[0]}</b><button class="hire" onclick="pick('${f[0]}',${f[1]})">Hire - ${f[1]} Pi</button></div></div>`;});document.getElementById('fleetGrid').innerHTML=h;}
renderFleet();
function status(m,c){let e=document.getElementById('piStatus');e.style.display='block';e.style.background=c||'#fff3cd';e.innerText=m;}
function setMode(m){mode=m;document.getElementById('tabTest').classList.toggle('active',m==='test');document.getElementById('tabMain').classList.toggle('active',m==='main');initPi();}
function initPi(){try{Pi.init({version:"2.0",sandbox:(mode==='test')});status(`Pi SDK Loaded ✅ Mode:${mode==='test'?'TESTNET':'MAINNET'} - Tap Login in Pi Browser`,"#ccffcc");}catch(e){status("Pi error:"+e.message,"#ffcccc");}}
window.addEventListener('load',()=>{setTimeout(initPi,800);let s=localStorage.getItem('piUser');if(s){try{piUser=JSON.parse(s);status("✅ Welcome "+piUser.username+" - Pi Connected!","#ccffcc");}catch{}}});
async function doLogin(){if(typeof Pi==='undefined'){status("❌ Open in Pi Browser!","#ffcccc");return;}status("⏳ Waiting for popup...");try{let a=await Pi.authenticate(['username','payments'],()=>{});piUser=a.user;localStorage.setItem('piUser',JSON.stringify(piUser));status(`✅ Welcome ${a.user.username} - Connected!`,"#ccffcc");}catch(err){status(`❌ ${err.message} - Enable Sandbox in develop.pi`,"#ffcccc");}}
function pick(n,p){selName=n;selPrice=p;document.getElementById('fleetSel').innerText=`Selected: ${n} - ${p} Pi`; }
const mapDist={"Johannesburg-Durban":568,"Durban-Johannesburg":568,"Johannesburg-Cape Town":1400,"Cape Town-Johannesburg":1400,"Johannesburg-Bloemfontein":400,"Johannesburg-Pretoria":58,"Pretoria-Johannesburg":58};
function calc(){let f=fromCity.value,t=toCity.value,qty=parseInt(quantity.value)||1;let pickup=pickupPoint.value,drop=dropPoint.value;let km=mapDist[f+"-"+t]||550;if(f===t)km=30;distKm=km;let total=((selPrice||5)+(km*0.009*qty)).toFixed(2);calcRes.innerHTML=`From:${f} | Pickup:${pickup||'--'}<br>To:${t} | Drop:${drop||'--'}<br>Distance:${km}km Qty:${qty} Price:π ${total}`;}
function quote(){if(!selName){alert("Tap Hire first");return;}let txt=`Fleet:${selName} From:${fromCity.value} Pickup:${pickupPoint.value} To:${toCity.value} Drop:${dropPoint.value} Dist:${distKm}km Qty:${quantity.value} PiUser:${piUser?piUser.username:'Guest'}`;let subj=encodeURIComponent(`Quote ${selName}`);let body=encodeURIComponent(txt);location.href=`mailto:revealed.logistics@gmail.com?cc=${cEmail.value}&subject=${subj}&body=${body}`;setTimeout(()=>{open(`https://wa.me/27607263726?text=${encodeURIComponent(txt)}`,'_blank');},800);}
</script></body></html>
