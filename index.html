<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REVEALED v17</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:Arial;margin:0;background:#f0f2f5}
header{background:#001a4d;color:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:99}
.card{background:#fff;border-radius:12px;overflow:hidden;margin:10px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.card img{width:100%;height:180px;object-fit:cover;background:#001a4d}
.btn{width:100%;background:#001a4d;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold}
#calcBox{background:#001a4d;color:#fff;padding:14px;border-radius:10px;margin:10px 0}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:2px solid #ccc;box-sizing:border-box}
.net button{padding:8px 14px;border-radius:20px;border:2px solid #ffcc00;background:transparent;color:#fff;font-weight:bold;margin:2px}
.net button.active{background:#ffcc00;color:#001a4d}
</style>
</head><body>
<header>
<h2>REVEALED LOGISTICS</h2>
<div id="piStatus" style="color:#ffcc00;font-weight:bold;padding:6px">Loading Pi...</div>
<div class="net">
<button id="bMain" class="active" onclick="setNet('mainnet')">MAINNET</button>
<button id="bTest" onclick="setNet('testnet')">TESTNET</button>
<button onclick="loginPi()" style="background:#ffcc00;color:#000;padding:8px 16px;border-radius:20px;font-weight:bold;border:none">Login Pi</button>
</div>
</header>
<div id="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;padding:10px"></div>
<div style="background:#fff;margin:12px;padding:14px;border-radius:12px;border:2px solid #001a4d">
<h3>Calculator - 0.2 Pi /100km</h3>
<input id="pick" list="cl" placeholder="Pickup e.g Gqeberha"><input id="drop" list="cl" placeholder="Drop e.g Kimberley"><datalist id="cl"></datalist>
<input id="date" type="date"><input id="puser" placeholder="Pi username">
<div id="calcBox">Tap HIRE on truck above</div>
<button class="btn" style="background:#ff8c00;font-size:18px" onclick="payPi()">Pay with Pi</button>
<div id="stat" style="font-weight:bold;margin-top:10px;min-height:30px"></div>
</div>
<script>
let sel="",price=0.2,user=null,km=0,currentNet='mainnet';
function initPi(isTest){
 try{
  if(typeof Pi==='undefined'){document.getElementById('piStatus').innerText='Open in Pi Browser to Login';return false;}
  Pi.init({version:"2.0",sandbox:isTest});
  document.getElementById('piStatus').innerText="Pi Ready - "+(isTest?"TESTNET":"MAINNET")+" - Tap Login";
  document.getElementById('piStatus').style.background=isTest?"#ff8c00":"#004400";
  return true;
 }catch(e){return false;}
}
setTimeout(function(){initPi(false);},800);
async function loginPi(){
 var s=document.getElementById('stat');
 if(typeof Pi==='undefined'){s.innerText='Open inside Pi Browser';return;}
 s.innerText='Logging in... wait for popup';
 try{
  const auth=await Pi.authenticate(['username','payments'],function(p){});
  user=auth.user;
  document.getElementById('puser').value=user.username;
  document.getElementById('piStatus').innerText="Welcome "+user.username;
  s.innerText="Login OK "+user.username;
 }catch(e){s.innerText="Login fail: "+e.message+" - Tap TESTNET then Login";}
}
function setNet(n){
 currentNet=n;
 initPi(n==='testnet');
 document.getElementById('bMain').className=n==='mainnet'?'active':'';
 document.getElementById('bTest').className=n==='testnet'?'active':'';
 document.getElementById('stat').innerText="Switched to "+n+" - Login again";
 user=null;
}
const cities={"gqeberha":[-33.96,25.60],"kimberley":[-28.72,24.74],"johannesburg":[-26.20,28.04],"bloemfontein":[-29.08,26.15],"cape town":[-33.92,18.42],"durban":[-29.85,31.02],"pretoria":[-25.74,28.22],"polokwane":[-23.90,29.46],"east london":[-33.01,27.91],"port elizabeth":[-33.96,25.60]};
const dl=document.getElementById('cl');Object.keys(cities).forEach(function(c){var o=document.createElement('option');o.value=c.charAt(0).toUpperCase()+c.slice(1);dl.appendChild(o);});
function hav(a,b,c,d){var R=6371;var dLat=(c-a)*3.1415/180;var dLon=(d-b)*3.1415/180;var x=Math.sin(dLat/2)**2+Math.cos(a*3.1415/180)*Math.cos(c*3.1415/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function calc(){var p=document.getElementById('pick').value.toLowerCase().trim();var d=document.getElementById('drop').value.toLowerCase().trim();var dt=document.getElementById('date').value;var box=document.getElementById('calcBox');
 if(!sel){box.innerHTML="Tap HIRE on truck";return 0}
 if(!p||!d){box.innerHTML="Truck: <b>"+sel+"</b><br>Enter Pickup & Drop";return 0}
 var pk=cities[p];var dk=cities[d];if(!pk){for(var k in cities){if(p.includes(k)||k.includes(p))pk=cities[k]}}if(!dk){for(var k in cities){if(d.includes(k)||k.includes(d))dk=cities[k]}}
 if(pk&&dk){km=Math.round(hav(pk[0],pk[1],dk[0],dk[1])*1.32)}else{km=400}
 var tot=price*km/100;tot=parseFloat(tot.toFixed(4));
 box.innerHTML="Truck: <b>"+sel+"</b><br>Route: "+p+" -> "+d+"<br>Distance: <b>"+km+" km</b><br><span style='font-size:22px;color:#ffcc00'>TOTAL: Pi "+tot+"</span><br>Collection: "+(dt||'Select date');
 return tot;
}
const fleet=[["Side Tippers","IMG-20260927-WA7926.jpg"],["Flat Decks","IMG-20260927-WA2466.jpg"],["Fuel Tanker","IMG-20260916-WA0687.jpg"],["Refrigerated","IMG-20260916-WA1910.jpg"],["Lowbed","IMG-20260916-WA2791.jpg"],["Flat Deck","IMG-20260916-WA6953.jpg"],["Side Curtain","IMG-20260916-WA7873.jpg"],["Tautliner","IMG-20260916-WA8594.jpg"],["Van","IMG-20260916-WA9084.jpg"],["Flat Bed","IMG-20260924-WA8680.jpg"]];
const g=document.getElementById('grid');fleet.forEach(function(f){var d=document.createElement('div');d.className='card';d.innerHTML="<img src='"+f[1]+"?v=17' onerror=\"this.onerror=null;this.src='https://via.placeholder.com/400x180/001a4d/ffcc00?text="+encodeURIComponent(f[0])+"'\"><div style='padding:10px'><b>"+f[0]+"</b><br>0.2 Pi/100km<br><button class='btn' onclick=\"hire('"+f[0]+"')\">Hire "+f[0]+"</button></div>";g.appendChild(d);});
function hire(n){sel=n;document.getElementById('stat').innerText="Selected "+n;calc();}
document.getElementById('pick').addEventListener('input',calc);document.getElementById('drop').addEventListener('input',calc);document.getElementById('date').addEventListener('change',calc);
async function payPi(){
 var pickup=document.getElementById('pick').value;var drop=document.getElementById('drop').value;var date=document.getElementById('date').value;
 if(!sel){alert('Tap Hire');return}if(!pickup||!drop||!date){alert('Fill Pickup, Drop, Date');return}
 if(!user){alert('Login first');await loginPi();if(!user)return}
 var tot=calc();
 document.getElementById('stat').innerText="Creating payment Pi "+tot+"...";
 try{
  await Pi.createPayment({amount:tot,memo:"REVEALED "+sel+" "+pickup+"->"+drop+" "+date,metadata:{truck:sel,pickup:pickup,drop:drop,date:date,distance:km,network:currentNet}},{
   onReadyForServerApproval:function(id){document.getElementById('stat').innerText="Approving "+id+"...";fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})}).catch(function(){document.getElementById('stat').innerText="Backend missing - add /api/approve";})},
   onReadyForServerCompletion:function(id,txid){document.getElementById('stat').innerText="PAID Pi "+tot+" TX:"+txid;fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,txid:txid})}).catch(function(){})},
   onCancel:function(){document.getElementById('stat').innerText="Cancelled"},
   onError:function(e){document.getElementById('stat').innerText="Error "+e.message}
  });
 }catch(e){document.getElementById('stat').innerText="Error "+e.message;}
}
</script></body></html>
