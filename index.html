<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Revealed Logistics | Mainnet Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#eef4ff}
.header{background:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.1);position:sticky;top:0;z-index:99}
.logo-img{height:48px}
.hero{position:relative;height:420px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:#0a1931;overflow:hidden}
.hero img.bg{position:absolute;width:100%;height:100%;object-fit:cover;opacity:.45}
.hero-content{position:relative;z-index:2}
.btn{padding:10px 18px;border-radius:25px;font-weight:900;border:none;cursor:pointer}
.btn-blue{background:#0052cc;color:#fff}.btn-yellow{background:#ffcc00;color:#0a1931}
.main-badge{background:#6a1bbf;color:#fff;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:900}
.section{max-width:1200px;margin:auto;padding:20px 14px}
.box{background:#fff;border-radius:12px;padding:14px;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.inp{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:5px 0}
.fleet{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:900px){.fleet{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.card img{width:100%;height:165px;object-fit:cover}
</style>
</head>
<body>

<div class="header">
<img src="logo-blue.png" class="logo-img" alt="Revealed Logistics">
<div style="display:flex;gap:8px;align-items:center">
<span class="main-badge">MAINNET Pi LIVE</span>
<button class="btn btn-blue" onclick="piLogin()">π Login</button>
</div>
</div>

<div class="hero">
<img class="bg" src="fleet-side-tipper-blue.jpg">
<div class="hero-content">
<img src="logo-blue.png" style="height:90px;background:#fff;padding:8px;border-radius:14px;margin-bottom:12px">
<h1>REVEALED LOGISTICS<br><span style="color:#ffcc00">8 BLUE TRUCKS - Pi PAYMENTS ONLY</span></h1>
<p>Real Pi Mainnet - No Test - No Fiat</p>
</div>
</div>

<div class="section">
<div id="fleet" class="fleet">Loading...</div>
</div>

<div class="section">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="box">
<h3>📦 Quote in Pi</h3>
<input id="tons" class="inp" type="number" placeholder="Tons e.g. 34">
<button class="btn btn-blue" style="width:100%" onclick="calcPi()">Calculate Pi</button>
<div id="qRes" style="color:#0052cc;font-weight:900;margin-top:8px"></div>
</div>
<div class="box" style="border:2px solid #6a1bbf">
<h3>π Pay with Real Pi</h3>
<input id="piAmt" class="inp" placeholder="Pi Amount">
<input id="ref" class="inp" placeholder="Ref RL-001">
<button class="btn btn-blue" style="width:100%" onclick="payPi()">π Pay Mainnet Pi</button>
<div id="piStatus" style="font-size:12px;margin-top:8px"></div>
</div>
</div>
</div>

<script>
// === MAINNET Pi - LIVE REAL Pi ===
Pi.init({version:"2.0", sandbox:false}); // FALSE = Mainnet Real Pi

let piUser=null;
async function piLogin(){
 try{
  const auth=await Pi.authenticate(['username','payments'],()=>{});
  piUser=auth.user;
  document.getElementById('piStatus').innerText='Mainnet Pi Connected: @'+auth.user.username;
  alert('Mainnet Pi Connected: @'+auth.user.username+' - Ready to pay real Pi');
 }catch(e){alert('Open in Pi Browser to pay with Mainnet Pi');}
}
function calcPi(){
 const t=parseFloat(document.getElementById('tons').value)||34;
 const pi=(t*0.2).toFixed(2);
 document.getElementById('qRes').innerText=t+'T = '+pi+' π (Mainnet)';
 document.getElementById('piAmt').value=pi;
 document.getElementById('ref').value='RL-MAIN-'+Date.now();
}
function payPi(){
 const amt=parseFloat(document.getElementById('piAmt').value);
 const ref=document.getElementById('ref').value||'RL-MAIN-'+Date.now();
 if(!amt)return alert('Enter Pi');
 if(!piUser)return piLogin();
 Pi.createPayment({amount:amt,memo:`Revealed Logistics MAINNET ${ref}`,metadata:{ref:ref}},{onReadyForServerApproval:id=>{document.getElementById('piStatus').innerText='Mainnet Approving... '+id},onReadyForServerCompletion:(id,txid)=>{document.getElementById('piStatus').innerText='Mainnet Pi Paid! TX:'+txid; alert('Real Pi Paid! '+txid)},onCancel:()=>{document.getElementById('piStatus').innerText='Cancelled'},onError:e=>{document.getElementById('piStatus').innerText='Error: '+e}});
}
async function load(){try{const r=await fetch('https://api.github.com/repos/Ndhlovu36/revealed-logistics/contents?ref=main');const f=await r.json();let imgs=f.filter(x=>x.name.toLowerCase().startsWith('img-')).map(x=>x.name).sort(); if(imgs.length>8)imgs.splice(6,1); const c=document.getElementById('fleet');c.innerHTML=''; imgs.forEach(n=>c.innerHTML+=`<div class="card"><img src="${n}"><div style="padding:8px;font-size:11px;font-weight:800">Blue Fleet</div></div>`)}catch(e){}}
load();
</script>
</body>
</html>
