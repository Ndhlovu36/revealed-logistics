<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revealed Logistics - Pi Fleet</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eef4ff;color:#0a1931}.h{background:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9;box-shadow:0 2px 10px rgba(0,0,0,.1)}.sw{display:flex;background:#eee;padding:3px;border-radius:20px}.sw button{padding:6px 12px;border:none;border-radius:15px;font-size:11px;font-weight:900;cursor:pointer}.a{background:#0052cc;color:#fff}.b{font-size:11px;font-weight:900;color:#fff;text-align:center;padding:8px}.main{background:#6a1bbf}.test{background:#ff4444}.s{max-width:1200px;margin:auto;padding:12px}.fleet{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:12px;overflow:hidden;border:3px solid transparent;cursor:pointer}.card.sel{border-color:#0052cc;transform:scale(1.02)}.card img{width:100%;height:130px;object-fit:cover;background:#ddd}.card div{padding:8px}.box{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.inp{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:5px 0;font-size:14px}.btn{padding:12px;border:none;border-radius:24px;font-weight:900;width:100%;color:#fff;cursor:pointer;font-size:14px}.btn:disabled{opacity:.5}</style></head><body>
<div id="banner" class="b main">MAINNET - Pi Fleet Ready - Tap Truck Below</div><div class="h"><div style="font-weight:900;color:#0052cc;line-height:1">REVEALED<br><span style="font-size:11px">LOGISTICS</span></div><div style="display:flex;gap:8px;align-items:center"><div class="sw"><button id="bM" class="a" onclick="setM(false)">MAIN</button><button id="bT" onclick="setM(true)">TEST</button></div><button class="btn" id="loginBtn" style="background:#0052cc;width:auto;padding:8px 14px" onclick="login()">π Login</button></div></div><div class="s"><div class="box"><input id="pickup" class="inp" placeholder="FROM e.g. Rustenburg"><input id="dropoff" class="inp" placeholder="TO e.g. Richards Bay"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="tons" class="inp" type="number" value="20" oninput="calc()"><input id="km" class="inp" type="number" value="450" oninput="calc()"></div><div id="selTxt" style="font-size:12px;color:#0052cc;font-weight:900;margin-top:6px">👇 Select truck from fleet below</div></div><div id="fleet" class="fleet"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><div class="box"><h3>📦 Quote</h3><div id="q" style="color:#0052cc;font-weight:900;font-size:18px;margin:8px 0">20T = 4.00 π</div><div id="r" style="font-size:11px;color:#666"></div></div><div class="box" style="border:2px solid #6a1bbf"><h3>π Pay with Pi</h3><input id="piAmt" class="inp" value="4.00" readonly><input id="oid" class="inp" value="RL-1234"><button class="btn" id="payBtn" style="background:#6a1bbf;margin-top:6px" onclick="pay()">π Pay Now</button><div id="status" style="font-size:11px;background:#f0f0f0;padding:8px;border-radius:6px;margin-top:8px;word-break:break-all">Not logged in - Open in Pi Browser</div></div></div></div>
<script>let isTest=false,sel=null,user=null;let trucks=[{id:"WA0687",n:"Fuel Tanker 50kL",s:"Diesel Bulk",img:"./IMG-20260916-WA0687.jpg"},{id:"WA1910",n:"Refrigerated 28T",s:"Cold Chain",img:"./IMG-20260916-WA1910.jpg"},{id:"WA2791",n:"Cargo Truck 30T",s:"General Cargo",img:"./IMG-20260916-WA2791.jpg"},{id:"WA0397",n:"Side Tipper 34T",s:"Mining Blue",img:"./IMG-20260918-WA0397.jpg"},{id:"WA6953",n:"Flat Deck 28T",s:"Steel Transport",img:"./IMG-20260916-WA6953.jpg"},{id:"WA7873",n:"Curtain Side 30T",s:"Curtain",img:"./IMG-20260916-WA7873.jpg"},{id:"WA8594",n:"Tautliner 32T",s:"Tautliner",img:"./IMG-20260916-WA8594.jpg"},{id:"WA9084",n:"Panel Van",s:"Last Mile",img:"./IMG-20260916-WA9084.jpg"}];function render(){document.getElementById('fleet').innerHTML=trucks.map(t=>`<div class="card ${sel==t.id?'sel':''}" onclick="selectT('${t.id}')"><img src="${t.img}" onerror="this.src='https://via.placeholder.com/300x200/0052cc/ffffff?text=${t.id}'"><div><b style="font-size:11px">${t.n}</b><br><span style="font-size:9px;color:#666">${t.s} • ${t.id}</span></div></div>`).join('')}function selectT(id){sel=id;document.getElementById('selTxt').innerText='✅ '+id+' SELECTED';render();calc()}function calc(){let tons=parseFloat(document.getElementById('tons').value)||20;let pi=(tons*0.2).toFixed(2);document.getElementById('q').innerText=tons+'T = '+pi+' π';document.getElementById('piAmt').value=pi}function setM(t){isTest=t;Pi.init({version:"2.0",sandbox:t});let b=document.getElementById('banner');b.className='b '+(t?'test':'main');b.innerText=t?'TESTNET':'MAINNET';document.getElementById('bM').className=t?'':'a';document.getElementById('bT').className=t?'a':'';document.getElementById('status').innerText='Switched to '+(t?'TESTNET':'MAINNET')}async function login(){try{document.getElementById('status').innerText='Connecting...';let a=await Pi.authenticate(['username','payments','wallet_address'],p=>{});user=a.user;document.getElementById('loginBtn').innerText='✓ '+a.user.username;document.getElementById('status').innerText='✅ '+a.user.username+' Ready';document.getElementById('status').style.background='#dcfce7'}catch(e){document.getElementById('status').innerText='Open in Pi Browser! '+e.message}}async function pay(){if(!user){alert('Login first');return}if(!sel){alert('Select truck');return}let amt=parseFloat(document.getElementById('piAmt').value);document.getElementById('status').innerText='Creating payment...';try{await Pi.createPayment({amount:amt,memo:"Revealed "+sel,metadata:{truck:sel}},{onReadyForServerApproval:id=>{document.getElementById('status').innerText='Approving '+id},onReadyForServerCompletion:(id,txid)=>{document.getElementById('status').innerText='✅ SUCCESS TXID:'+txid;alert('Paid! '+txid)},onCancel:id=>{document.getElementById('status').innerText='Cancelled'},onError:e=>{document.getElementById('status').innerText='Error '+e.message}})}catch(e){document.getElementById('status').innerText='Pay err '+e.message}}Pi.init({version:"2.0",sandbox:false});render();calc();</script></body></html>
