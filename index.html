async function loginWithPi(){
 const s=document.getElementById('piStatus');
 s.innerText="Logging in...";
 try{

  const timeout = new Promise((_,rej)=> setTimeout(()=>rej(new Error("Pi Browser timeout - Use Pi Browser App")), 8000));
  const authPromise = Pi.authenticate(['username','payments'], onIncomplete);
  const auth = await Promise.race([authPromise, timeout]);
  user=auth.user;
  s.innerText="Welcome "+user.username+" ✅ "+currentNet;
  document.getElementById('piUser').value=user.username;
  document.getElementById('status').innerText="Login OK - Now hire & pay";
 }catch(e){
  console.error(e);
  s.innerText="Login failed: "+e.message;

   document.getElementById('piUser').value=user.username;
   s.innerText="TEST MODE: "+user.username+" (Mock login)";
   document.getElementById('status').innerText="Mock login OK - Calculator works";
  }
 }
}

function getLatLon(s){
 s=s.toLowerCase().trim();
 if(!s) return null;
 if(cities[s]) return cities[s];
 for(let k in cities){ if(s.includes(k)||k.includes(s)) return cities[k]; }
 return null;
}
function haversine(lat1,lon1,lat2,lon2){
 const R=6371;
 const dLat=(lat2-lat1)*Math.PI/180;
 const dLon=(lon2-lon1)*Math.PI/180;
 const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function calcDist(){
 const pickup=document.getElementById('pickupPoint').value.trim();
 const drop=document.getElementById('dropPoint').value.trim();
 const date=document.getElementById('collectDate').value;
 const res=document.getElementById('calcRes');
 if(!selName){ res.innerHTML="👆 First tap HIRE on any truck above"; return 0; }
 if(!pickup||!drop){ res.innerHTML=`Truck: <b>${selName}</b><br>Enter BOTH Pickup & Drop cities<br>Distance will calculate live`; return 0; }
 const p=getLatLon(pickup);
 const d=getLatLon(drop);
 if(p&&d){ distanceKm=Math.round(haversine(p[0],p[1],d[0],d[1])*1.32); }
 else { distanceKm=400; res.innerHTML+= "<br><small>City not in 91 list, using 400km estimate</small>"; }
 let total = 0.2 * distanceKm / 100;
 total=parseFloat(total.toFixed(4));
 res.innerHTML=`Truck: <b>${selName}</b><br>Route: ${pickup} → ${drop}<br>Distance: <b>${distanceKm} km</b><br>Rate: π0.2 /100km<br><span style="font-size:24px;color:#ffcc00">TOTAL: π ${total}</span><br>Collection: ${date||'Select date'}<br><small>Price fluctuates by km</small>`;
 return total;
}

async function payWithPi(){
 const pickup=document.getElementById('pickupPoint').value;
 const drop=document.getElementById('dropPoint').value;
 const date=document.getElementById('collectDate').value;
 if(!selName){ alert('Tap HIRE first'); return; }
 if(!pickup||!drop){ alert('Enter Pickup & Drop'); return; }
 if(!date){ alert('Select Collection Date'); return; }
 if(!user){ await loginWithPi(); if(!user) return; }
 const total=calcDist();
 status("Creating payment π "+total+"...");
 try{
  Pi.createPayment({amount: total, memo: `REVEALED ${selName} ${pickup}->${drop} ${date}`, metadata:{truck:selName, pickup, drop, date, distance:distanceKm}},{
   onReadyForServerApproval:function(id){ status("Approving... "+id); fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})}).catch(()=>{}); },
   onReadyForServerCompletion:function(id,txid){ status(`✅ PAID π ${total} SUCCESS TX:${txid} - ${selName} ${distanceKm}km booked ${date}`); },
   onCancel:function(){ status("❌ Cancelled"); },
   onError:function(e){ status("❌ "+e.message); console.error(e); }

 }catch(e){ status("❌ "+e.message); }
