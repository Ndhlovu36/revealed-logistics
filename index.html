<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REVEALED LOGISTICS</title>
<style>
body{background:#001a4d;color:#fff;font-family:Arial;margin:0;padding:10px;text-align:center}
.inp{width:92%;padding:12px;margin:6px;border-radius:10px;border:0}
.btn{padding:10px 14px;border-radius:8px;border:0;font-weight:bold;margin:4px;cursor:pointer}
.btn-mode{background:#222;color:#fff}
.btn-mode.active{background:gold;color:#000}
.btn-pi{background:gold;color:#000;padding:14px;width:48%;border-radius:12px;font-size:16px;margin:6px 1%;border:0}
.btn-cancel{background:#ff3b3b;color:#fff;padding:14px;width:48%;border-radius:12px;font-size:16px;margin:6px 1%;border:0}
.fleet{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px}
.card{background:#fff;color:#000;border-radius:10px;overflow:hidden;padding-bottom:6px;cursor:pointer;border:3px solid transparent}
.card img{width:100%;height:90px;object-fit:cover;display:block}
.card.selected{border-color:gold;transform:scale(1.02)}
.status{background:#000;padding:10px;border-radius:8px;margin-top:10px}
.dist-box{background:#fff;color:#000;padding:14px;border-radius:12px;margin:10px;text-align:left;display:none;line-height:1.5}
.price-big{font-size:24px;color:#001a4d;background:gold;padding:8px 14px;border-radius:8px;display:inline-block;margin:6px 0}
.action-bar{display:none;margin:10px}
.email-box{background:#ffeb3b;color:#000;padding:12px;border-radius:10px;margin:15px 10px;font-weight:bold}
</style>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
<h2>REVEALED LOGISTICS</h2>
<button class="btn btn-mode active" id="testBtn" onclick="setMode('test')">Testnet</button>
<button class="btn btn-mode" id="mainBtn" onclick="setMode('mainnet')">Mainnet</button>
<button class="btn" style="background:white" onclick="login()">Login with Pi</button>
<p id="modeText">Mode: testnet</p>

<datalist id="saCities">
<option value="Johannesburg"><option value="Sandton"><option value="Pretoria"><option value="Centurion"><option value="Midrand"><option value="Soweto"><option value="Roodepoort"><option value="Boksburg"><option value="Benoni"><option value="Germiston"><option value="Kempton Park"><option value="Vereeniging"><option value="Krugersdorp">
<option value="Durban"><option value="Pinetown"><option value="Umhlanga"><option value="Pietermaritzburg"><option value="Newcastle"><option value="Richards Bay"><option value="Ladysmith"><option value="Port Shepstone"><option value="Ballito">
<option value="Cape Town"><option value="Stellenbosch"><option value="Paarl"><option value="Bellville"><option value="Worcester"><option value="George"><option value="Knysna"><option value="Mossel Bay">
<option value="Gqeberha (Port Elizabeth)"><option value="East London"><option value="Mthatha"><option value="Queenstown">
<option value="Bloemfontein"><option value="Welkom"><option value="Kroonstad"><option value="Bethlehem"><option value="Sasolburg">
<option value="Polokwane"><option value="Tzaneen"><option value="Thohoyandou"><option value="Musina"><option value="Mokopane">
<option value="Mbombela (Nelspruit)"><option value="Witbank (eMalahleni)"><option value="Middelburg"><option value="Secunda"><option value="Ermelo">
<option value="Rustenburg"><option value="Mahikeng"><option value="Klerksdorp"><option value="Potchefstroom"><option value="Brits">
<option value="Kimberley"><option value="Upington"><option value="De Aar"><option value="Kuruman">
</datalist>

<input id="pickup" class="inp" list="saCities" placeholder="Pickup city" oninput="updateQuote()">
<input id="drop" class="inp" list="saCities" placeholder="Drop city" oninput="updateQuote()">

<div id="distBox" class="dist-box"></div>

<div class="fleet">
<div class="card" onclick="selectFleet(this,'Side Tipper',0.0045,8)"><img src="IMG-20260918-WA0397.jpg"><b>Side Tipper</b></div>
<div class="card" onclick="selectFleet(this,'Flat Deck',0.0038,6)"><img src="IMG-20260916-WA8594.jpg"><b>Flat Deck</b></div>
<div class="card" onclick="selectFleet(this,'Side Curtain',0.0035,5)"><img src="IMG-20260916-WA7873.jpg"><b>Side Curtain</b></div>
<div class="card" onclick="selectFleet(this,'Panel Van',0.0018,1.2)"><img src="IMG-20260916-WA9084.jpg"><b>Panel Van</b></div>
<div class="card" onclick="selectFleet(this,'Abnormal Load',0.008,12)"><img src="IMG-20260916-WA2791.jpg"><b>Abnormal Load</b></div>
<div class="card" onclick="selectFleet(this,'Refrigerated',0.005,7)"><img src="IMG-20260916-WA1910.jpg"><b>Refrigerated</b></div>
<div class="card" onclick="selectFleet(this,'Fuel Tanker',0.006,9)"><img src="IMG-20260916-WA0687.jpg"><b>Fuel Tanker</b></div>
<div class="card" onclick="selectFleet(this,'8th Fleet',0.004,6)"><img src="IMG-20260918-WA0397.jpg"><b>8th Fleet</b></div>
</div>

<input type="hidden" id="truck"><input type="hidden" id="truckRate"><input type="hidden" id="truckBase">
<input id="wa" class="inp" placeholder="WhatsApp number">

<div id="actionBar" class="action-bar">
<button class="btn btn-cancel" onclick="cancelQuote()">❌ Cancel</button>
<button class="btn btn-pi" id="payBtn" onclick="pay()">💳 Pay with Pi</button>
</div>

<div id="status" class="status">✅ Select Pickup → Drop → Truck to see Pi price</div>
<div class="email-box">📧 revealed.logistics@gmail.com</div>

<script>
const coords={"Johannesburg":{lat:-26.2041,lon:28.0473},"Sandton":{lat:-26.1061,lon:28.0567},"Pretoria":{lat:-25.7479,lon:28.2293},"Centurion":{lat:-25.8603,lon:28.1894},"Midrand":{lat:-25.9987,lon:28.1284},"Soweto":{lat:-26.2678,lon:27.8585},"Roodepoort":{lat:-26.1625,lon:27.872},"Boksburg":{lat:-26.2114,lon:28.2578},"Benoni":{lat:-26.1885,lon:28.3206},"Germiston":{lat:-26.2313,lon:28.1635},"Kempton Park":{lat:-26.1064,lon:28.2323},"Vereeniging":{lat:-26.6731,lon:27.9261},"Krugersdorp":{lat:-26.1009,lon:27.7759},"Durban":{lat:-29.8587,lon:31.0218},"Pinetown":{lat:-29.8186,lon:30.8549},"Umhlanga":{lat:-29.7251,lon:31.0827},"Pietermaritzburg":{lat:-29.6006,lon:30.3794},"Newcastle":{lat:-27.7577,lon:29.9271},"Richards Bay":{lat:-28.7807,lon:32.0383},"Ladysmith":{lat:-28.5539,lon:29.7826},"Port Shepstone":{lat:-30.7413,lon:30.4552},"Ballito":{lat:-29.5396,lon:31.2136},"Cape Town":{lat:-33.9249,lon:18.4241},"Stellenbosch":{lat:-33.9321,lon:18.8602},"Paarl":{lat:-33.7341,lon:18.9626},"Bellville":{lat:-33.9037,lon:18.6258},"Worcester":{lat:-33.6452,lon:19.4433},"George":{lat:-33.9635,lon:22.4617},"Knysna":{lat:-34.0363,lon:23.0474},"Mossel Bay":{lat:-34.1806,lon:22.1463},"Gqeberha (Port Elizabeth)":{lat:-33.9608,lon:25.6022},"East London":{lat:-33.0153,lon:27.9116},"Mthatha":{lat:-31.5886,lon:28.7841},"Queenstown":{lat:-31.8977,lon:26.8755},"Bloemfontein":{lat:-29.0852,lon:26.1596},"Welkom":{lat:-27.9837,lon:26.7341},"Kroonstad":{lat:-27.6523,lon:27.2321},"Bethlehem":{lat:-28.2313,lon:28.3075},"Sasolburg":{lat:-26.8146,lon:27.8155},"Polokwane":{lat:-23.9045,lon:29.4689},"Tzaneen":{lat:-23.8323,lon:30.1611},"Thohoyandou":{lat:-22.9577,lon:30.4487},"Musina":{lat:-22.3456,lon:30.0407},"Mokopane":{lat:-24.1944,lon:29.0096},"Mbombela (Nelspruit)":{lat:-25.4753,lon:30.9694},"Witbank (eMalahleni)":{lat:-25.8727,lon:29.2406},"Middelburg":{lat:-25.7752,lon:29.4648},"Secunda":{lat:-26.519,lon:29.1936},"Ermelo":{lat:-26.5235,lon:29.9841},"Rustenburg":{lat:-25.6678,lon:27.2419},"Mahikeng":{lat:-25.8602,lon:25.6403},"Klerksdorp":{lat:-26.8521,lon:26.6665},"Potchefstroom":{lat:-26.7135,lon:27.0957},"Brits":{lat:-25.635,lon:27.7778},"Kimberley":{lat:-28.7282,lon:24.7499},"Upington":{lat:-28.4472,lon:21.256},"De Aar":{lat:-30.6497,lon:24.0122},"Kuruman":{lat:-27.4521,lon:23.4329}};
function haversine(a,b){const R=6371;const dLat=(b.lat-a.lat)*Math.PI/180;const dLon=(b.lon-a.lon)*Math.PI/180;const lat1=a.lat*Math.PI/180;const lat2=b.lat*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
let mode='test', user=null, selected=null, isPaying=false, lastKm=0;
Pi.init({version:"2.0"});
function setMode(m){mode=m;document.getElementById('testBtn').classList.toggle('active',m==='test');document.getElementById('mainBtn').classList.toggle('active',m==='mainnet');document.getElementById('modeText').innerText='Mode: '+m;updateQuote();}
function selectFleet(el,name,rate,base){if(selected)selected.classList.remove('selected');el.classList.add('selected');selected=el;document.getElementById('truck').value=name;document.getElementById('truckRate').value=rate;document.getElementById('truckBase').value=base;updateQuote();}
function updateQuote(){let pu=document.getElementById('pickup').value.trim();let dr=document.getElementById('drop').value.trim();let tr=document.getElementById('truck').value;let rate=parseFloat(document.getElementById('truckRate').value)||0;let base=parseFloat(document.getElementById('truckBase').value)||0;let box=document.getElementById('distBox');let bar=document.getElementById('actionBar');if(!coords[pu]||!coords[dr]||pu===dr){box.style.display='none';bar.style.display='none';return;}let km=haversine(coords[pu],coords[dr]);let kmRoad=Math.round(km*1.28);lastKm=kmRoad;let hours=Math.round(kmRoad/75*10)/10;if(!tr){box.style.display='block';bar.style.display='none';box.innerHTML=`📏 <b>${pu} → ${dr}</b><br>Distance: <b>${kmRoad} km</b> | ⏱️ ${hours} hrs<br><span style="color:#b00">👆 Tap a truck to see Pi price</span>`;return;}let price=base+(kmRoad*rate);price=Math.round(price*100)/100;box.style.display='block';bar.style.display='block';box.innerHTML=`📏 <b>${pu} → ${dr}</b><br>Distance: <b>${kmRoad} km</b> | ⏱️ ${hours} hrs<br>Truck: <b>${tr}</b><br><span class="price-big">💰 π ${price}</span><br><small>Base π ${base} + (${kmRoad}km × π ${rate}) | Mode: ${mode}</small>`;document.getElementById('status').innerText=`✅ Price π ${price} - Pay or Cancel`;window.currentPrice=price;}
function cancelQuote(){document.getElementById('pickup').value='';document.getElementById('drop').value='';document.getElementById('truck').value='';document.getElementById('truckRate').value='';document.getElementById('truckBase').value='';if(selected)selected.classList.remove('selected');selected=null;document.getElementById('distBox').style.display='none';document.getElementById('actionBar').style.display='none';document.getElementById('status').innerText='❌ Cancelled - Select new cities';window.currentPrice=0;}
async function login(){try{let a=await Pi.authenticate(['username','payments'],p=>fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:p.identifier,txid:p.transaction.txid})}));user=a.user;document.getElementById('status').innerText='Welcome '+user.username+' ✅ Ready to Pay';}catch(e){document.getElementById('status').innerText='Login failed: '+e;}}
async function pay(){if(isPaying)return;let pu=document.getElementById('pickup').value,dr=document.getElementById('drop').value,tr=document.getElementById('truck').value;if(!pu||!dr||!tr){alert('Complete quote first');return;}if(!user){alert('Login with Pi first');return;}let price=window.currentPrice||1;isPaying=true;let btn=document.getElementById('payBtn');btn.innerText=`Paying π ${price}...`;try{Pi.createPayment({amount:price,memo:`Revealed ${tr} ${pu}->${dr} ${lastKm}km`.slice(0,90),metadata:{pickup:pu,dropoff:dr,truck:tr,mode:mode,km:lastKm,price:price}},{onReadyForServerApproval:async pid=>{await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid})})},onReadyForServerCompletion:async(pid,txid)=>{await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:pid,txid:txid})});document.getElementById('status').innerText=`✅ Paid π ${price}! ${tr} booked`;isPaying=false;btn.innerText='💳 Pay with Pi';},onCancel:()=>{document.getElementById('status').innerText='Payment cancelled - Pay again or Cancel';isPaying=false;btn.innerText='💳 Pay with Pi';},onError:e=>{document.getElementById('status').innerText='Error '+e;isPaying=false;btn.innerText='💳 Pay with Pi';}});}catch(e){document.getElementById('status').innerText='Error '+e;isPaying=false;btn.innerText='💳 Pay with Pi';}}
</script>
</body>
</html>
