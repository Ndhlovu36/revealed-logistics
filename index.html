function getLatLon(s){
 s=s.toLowerCase().trim();
 if(cities[s]) return cities[s];
 for(let k in cities){ if(s.includes(k)||k.includes(s)) return cities[k]; }
 return null;
}
function haversine(lat1,lon1,lat2,lon2){
 const R=6371;
 const dLat=(lat2-lat1)*Math.PI/180;
 const dLon=(lon2-lon1)*Math.PI/180;
 const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function calcDist(){
 const pickup=document.getElementById('pickupPoint').value.trim();
 const drop=document.getElementById('dropPoint').value.trim();
 const date=document.getElementById('collectDate').value;
 if(!pickup||!drop||!selName){
  document.getElementById('calcRes').innerHTML="Select truck + Enter Pickup & Drop";
  return 0;
 }
 const p=getLatLon(pickup);
 const d=getLatLon(drop);
 if(p&&d){
  let km=haversine(p[0],p[1],d[0],d[1])*1.32;
  distanceKm=Math.round(km);
 } else {
  distanceKm=400;
 }
 let rate=selPrice;
 let baseFee=2;
 let surcharge = distanceKm>500?1.3: distanceKm>300?1.2:1;
 let total=(baseFee + (rate * distanceKm / 100))*surcharge;
 total=parseFloat(total.toFixed(2));
 document.getElementById('calcRes').innerHTML=
  `Truck: <b>${selName}</b><br>Route: ${pickup} → ${drop}<br>Distance: <b>${distanceKm} km</b> (91 cities)<br>Rate: π ${rate}/100km + Base π ${baseFee}${surcharge>1?` + ${Math.round((surcharge-1)*100)}% long-distance`:``}<br><span style="font-size:22px;color:#ffcc00">TOTAL: π ${total}</span><br>Date: ${date||'Not set'}`;
 return total;
}
