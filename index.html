let lastPending=null;
function initPi(isTest){
 try{
  if(typeof Pi==='undefined'){
    document.getElementById('piStatus').innerText='⚠️ Pi SDK not loaded - Open in Pi Browser';
    document.getElementById('piStatus').style.background='#880000';
    return false;
  }
  Pi.init({version:"2.0",sandbox:isTest});
  document.getElementById('piStatus').innerText="✅ Pi Ready - "+(isTest?"TESTNET":"MAINNET")+" - Tap Login";
  document.getElementById('piStatus').style.background=isTest?"#ff8c00":"#004400";
  return true;
 }catch(e){
  document.getElementById('piStatus').innerText='Pi Error: '+e.message;
  return false;
 }
}
function setNet(n){
 currentNet=n; localStorage.setItem('net',n);
 initPi(n==='testnet');
 document.getElementById('bMain').className=n==='mainnet'?'active':'';
 document.getElementById('bTest').className=n==='testnet'?'active':'';
 document.getElementById('stat').innerText="Switched to "+n+" - Login again";
 user=null; lastPending=null;
}
setTimeout(()=>initPi(currentNet==='testnet'),800);
async function clearPending(){
 const s=document.getElementById('stat');
 if(!lastPending){ s.innerText='No pending payment stored. To force clear: Close Pi Browser fully - Swipe it away from recent apps - Then reopen Pi Browser, open your site again, and tap Login Pi. Pi will auto-detect pending and I will clear it.'; return; }
 s.innerText='Clearing '+lastPending.identifier+'...';
 try{
  if(lastPending.transaction && lastPending.transaction.txid){
    await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:lastPending.identifier,txid:lastPending.transaction.txid})});
    s.innerText='✅ Sent Complete for old TX - NOW CLOSE Pi Browser FULLY (swipe away) and reopen - then Login again';
  }else{
    await fetch('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:lastPending.identifier})});
    s.innerText='✅ Sent Cancel for old payment - NOW CLOSE Pi Browser FULLY and reopen - then Login again';
  }
 }catch(e){ s.innerText='Clear attempted but API error: '+e.message+' - Still CLOSE Pi Browser fully and try again'; }
}
async function loginPi(){
 const s=document.getElementById('stat');
 if(typeof Pi==='undefined'){ s.innerText='Pi not found - open in Pi Browser'; return; }
 s.innerText='🔄 Logging in - If freezes 5 sec, tap red Clear button...';
 let timedOut=false;
 const timeout=setTimeout(()=>{ timedOut=true; s.innerText='⏳ Login hanging - Found pending payment blocking you. Tap RED Clear button above, then CLOSE Pi Browser fully (swipe away) and reopen.'; },5000);
 const onIncomplete=(payment)=>{
  lastPending=payment;
  clearTimeout(timeout);
  s.innerHTML='⚠️ Found PENDING payment blocking login:<br>ID:'+payment.identifier.slice(0,12)+'...<br>TX:'+(payment.transaction?payment.transaction.txid.slice(0,12):'none')+'<br><b>Fix: Tap RED Clear button above, then CLOSE Pi Browser fully and reopen.</b>';
  if(payment.transaction && payment.transaction.txid){
    fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:payment.identifier,txid:payment.transaction.txid})}).then(()=>{s.innerText+=' [Auto-Complete Sent - Now close Pi Browser fully]';});
  }else{
    fetch('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:payment.identifier})}).then(()=>{s.innerText+=' [Auto-Cancel Sent - Now close Pi Browser fully]';});
  }
 };
 try{
  const auth=await Pi.authenticate(['username','payments'],onIncomplete);
  clearTimeout(timeout);
  if(timedOut) return;
  user=auth.user;
  document.getElementById('puser').value=user.username;
  document.getElementById('piStatus').innerText="✅ "+user.username;
  s.innerText="✅ Login OK "+user.username+" - Ready to Pay";
 }catch(e){
  clearTimeout(timeout);
  s.innerText="Login error: "+e.message+" - If it says pending, use Red Clear button, then close Pi Browser fully";
 }
}
