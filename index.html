<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REVEALED LOGISTICS</title>
<style>
body{background:#001a4d;color:#fff;font-family:Arial;margin:0;padding:10px;text-align:center}
.inp{width:92%;padding:12px;margin:6px;border-radius:10px;border:0;font-size:16px}
.sel{width:95%;padding:12px;margin:6px;border-radius:10px;border:0;background:white;font-weight:bold;font-size:16px}
.btn{padding:12px 14px;border-radius:8px;border:0;font-weight:bold;margin:4px;cursor:pointer}
.btn-mode{background:#222;color:#fff}
.btn-mode.active{background:gold;color:#000}
.btn-pi{background:gold;color:#000;padding:14px;width:48%;border-radius:12px;font-size:16px;margin:6px 1%;border:0}
.btn-cancel{background:#ff3b3b;color:#fff;padding:14px;width:48%;border-radius:12px;font-size:16px;margin:6px 1%;border:0}

.action-bar{display:none;margin:10px}
.weight-box{background:#002366;padding:10px;border-radius:10px;margin:10px;border:1px solid gold}
</style>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
<h2>REVEALED LOGISTICS</h2>

<input id="drop" class="inp" list="saCities" placeholder="Drop city - type or select" oninput="updateQuote()" onchange="updateQuote()">

<div class="weight-box">

<select id="tons" class="sel" onchange="updateQuote()">
<option value="">-- Select Tons --</option>
<option value="1">1 Ton</option>
<option value="2">2 Tons</option>
<option value="5">5 Tons</option>
<option value="10">10 Tons</option>
<option value="15">15 Tons</option>
<option value="20">20 Tons</option>
<option value="30">30 Tons</option>
<option value="34">34 Tons Full Load</option>
</select>
</div>

<div id="distBox" class="dist-box"></div>

<div class="fleet">
<div class="card" onclick="selectFleet(this,'Side Tipper 34T',0.0045,8,34)"><img src="IMG-20260918-WA0397.jpg"><b>Side Tipper</b><br><small>Max 34T</small></div>
<div class="card" onclick="selectFleet(this,'Flat Deck 34T',0.0038,6,34)"><img src="IMG-20260916-WA8594.jpg"><b>Flat Deck</b><br><small>Max 34T</small></div>
<div class="card" onclick="selectFleet(this,'Side Curtain 30T',0.0035,5,30)"><img src="IMG-20260916-WA7873.jpg"><b>Side Curtain</b><br><small>Max 30T</small></div>
<div class="card" onclick="selectFleet(this,'Panel Van 1.5T',0.0018,1.2,1.5)"><img src="IMG-20260916-WA9084.jpg"><b>Panel Van</b><br><small>Max 1.5T</small></div>
</div>

<input type="hidden" id="truck"><input type="hidden" id="truckRate"><input type="hidden" id="truckBase"><input type="hidden" id="truckMax">
<input id="wa" class="inp" placeholder="WhatsApp number (optional)">

<div id="actionBar" class="action-bar">
<button class="btn btn-cancel" onclick="cancelQuote()">❌ Cancel Quote</button>
<button class="btn btn-pi" id="payBtn" onclick="pay()">💳 Pay with Pi</button>
</div>

<div id="status" class="status">Step 1: Select Pickup & Drop to see distance</div>
<div style="background:#ffeb3b;color:#000;padding:10px;border-radius:8px;margin:15px 10px;font-weight:bold">📧 revealed.logistics@gmail.com</div>

<script>
// SIMPLE COORDS - normalized keys (no brackets) to avoid freeze
const cityCoords={
"Johannesburg":{lat:-26.2041,lon:28.0473},"Pretoria":{lat:-25.7479,lon:28.2293},"Durban":{lat:-29.8587,lon:31.0218},"Cape Town":{lat:-33.9249,lon:18.4241},
"Sandton":{lat:-26.1061,lon:28.0567},"Centurion":{lat:-25.8603,lon:28.1894},"Midrand":{lat:-25.9987,lon:28.1284},"Soweto":{lat:-26.2678,lon:27.8585},"Roodepoort":{lat:-26.1625,lon:27.872},"Boksburg":{lat:-26.2114,lon:28.2578},"Benoni":{lat:-26.1885,lon:28.3206},"Germiston":{lat:-26.2313,lon:28.1635},"Kempton Park":{lat:-26.1064,lon:28.2323},"Vereeniging":{lat:-26.6731,lon:27.9261},"Vanderbijlpark":{lat:-26.7115,lon:27.8396},"Krugersdorp":{lat:-26.1009,lon:27.7759},"Randburg":{lat:-26.0946,lon:28.0067},"Alberton":{lat:-26.2668,lon:28.1217},
"Pinetown":{lat:-29.8186,lon:30.8549},"Umhlanga":{lat:-29.7251,lon:31.0827},"Pietermaritzburg":{lat:-29.6006,lon:30.3794},"Newcastle":{lat:-27.7577,lon:29.9271},"Richards Bay":{lat:-28.7807,lon:32.0383},"Ladysmith":{lat:-28.5539,lon:29.7826},"Port Shepstone":{lat:-30.7413,lon:30.4552},"Ballito":{lat:-29.5396,lon:31.2136},"Empangeni":{lat:-28.7695,lon:31.8935},
"Stellenbosch":{lat:-33.9321,lon:18.8602},"Paarl":{lat:-33.7341,lon:18.9626},"Somerset West":{lat:-34.0812,lon:18.8436},"Bellville":{lat:-33.9037,lon:18.6258},"Worcester":{lat:-33.6452,lon:19.4433},"George":{lat:-33.9635,lon:22.4617},"Knysna":{lat:-34.0363,lon:23.0474},"Mossel Bay":{lat:-34.1806,lon:22.1463},"Oudtshoorn":{lat:-33.5906,lon:22.2014},
"Gqeberha":{lat:-33.9608,lon:25.6022},"Port Elizabeth":{lat:-33.9608,lon:25.6022},"East London":{lat:-33.0153,lon:27.9116},"Mthatha":{lat:-31.5886,lon:28.7841},"Queenstown":{lat:-31.8977,lon:26.8755},"Uitenhage":{lat:-33.7625,lon:25.4011},"Grahamstown":{lat:-33.3042,lon:26.5328},
"Bloemfontein":{lat:-29.0852,lon:26.1596},"Welkom":{lat:-27.9837,lon:26.7341},"Kroonstad":{lat:-27.6523,lon:27.2321},"Bethlehem":{lat:-28.2313,lon:28.3075},"Sasolburg":{lat:-26.8146,lon:27.8155},"Parys":{lat:-26.9028,lon:27.4528},
"Polokwane":{lat:-23.9045,lon:29.4689},"Tzaneen":{lat:-23.8323,lon:30.1611},"Thohoyandou":{lat:-22.9577,lon:30.4487},"Musina":{lat:-22.3456,lon:30.0407},"Mokopane":{lat:-24.1944,lon:29.0096},"Bela-Bela":{lat:-24.8832,lon:28.2939},
"Mbombela":{lat:-25.4753,lon:30.9694},"Nelspruit":{lat:-25.4753,lon:30.9694},"Witbank":{lat:-25.8727,lon:29.2406},"eMalahleni":{lat:-25.8727,lon:29.2406},"Middelburg":{lat:-25.7752,lon:29.4648},"Secunda":{lat:-26.519,lon:29.1936},"Ermelo":{lat:-26.5235,lon:29.9841},"White River":{lat:-25.3312,lon:31.011},
"Rustenburg":{lat:-25.6678,lon:27.2419},"Mahikeng":{lat:-25.8602,lon:25.6403},"Klerksdorp":{lat:-26.8521,lon:26.6665},"Potchefstroom":{lat:-26.7135,lon:27.0957},"Brits":{lat:-25.635,lon:27.7778},"Vryburg":{lat:-26.9563,lon:24.7284},
"Kimberley":{lat:-28.7282,lon:24.7499},"Upington":{lat:-28.4472,lon:21.256},"De Aar":{lat:-30.6497,lon:24.0122},"Kuruman":{lat:-27.4521,lon:23.4329},"Kathu":{lat:-27.6989,lon:23.0594}
};

function getCoord(name){
  if(!name) return null;
  name=name.trim();
  return cityCoords[name] || null;
}
function haversine(a,b){
  const R=6371; const dLat=(b.lat-a.lat)*Math.PI/180; const dLon=(b.lon-a.lon)*Math.PI/180;
  const lat1=a.lat*Math.PI/180; const lat2=b.lat*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

let mode='test', user=null, selected=null, isPaying=false, lastKm=0, currentPrice=0;

// FIX: init once only - this was freezing login
try{
  Pi.init({version:"2.0", sandbox:true});
  console.log("Pi SDK OK");
  document.getElementById('status').innerText="Pi SDK ready - Please login";
}catch(e){
  document.getElementById('status').innerText="Pi SDK error - Open in Pi Browser: "+e;
}

function setMode(m){
  mode=m;
  document.getElementById('testBtn').classList.toggle('active',m==='test');
  document.getElementById('mainBtn').classList.toggle('active',m==='mainnet');
  document.getElementById('modeText').innerText="Mode: "+m+" - Login again if needed";
  updateQuote();
}

function selectFleet(el,name,rate,base,max){
  if(selected) selected.classList.remove('selected');
  el.classList.add('selected'); selected=el;
  document.getElementById('truck').value=name;
  document.getElementById('truckRate').value=rate;
  document.getElementById('truckBase').value=base;
  document.getElementById('truckMax').value=max;
  updateQuote();
}

function updateQuote(){
  let pu=document.getElementById('pickup').value.trim();
  let dr=document.getElementById('drop').value.trim();
  let tons=parseFloat(document.getElementById('tons').value)||0;
  let tr=document.getElementById('truck').value;
  let rate=parseFloat(document.getElementById('truckRate').value)||0;
  let base=parseFloat(document.getElementById('truckBase').value)||0;
  let max=parseFloat(document.getElementById('truckMax').value)||34;

  let box=document.getElementById('distBox');
  let bar=document.getElementById('actionBar');
  let c1=getCoord(pu); let c2=getCoord(dr);

  if(!pu ||!dr){
    box.style.display='none'; bar.style.display='none';
    document.getElementById('status').innerText="Select Pickup and Drop";
    return;
  }
  if(!c1 ||!c2){
    box.style.display='block'; bar.style.display='none';
    box.innerHTML=`⚠️ City not found in GPS: ${!c1?pu:dr}<br>Pick from dropdown list`;
    return;
  }
  if(pu===dr){
    box.style.display='block'; bar.style.display='none';
    box.innerHTML="⚠️ Pickup and Drop cannot be same";
    return;
  }

  let km=haversine(c1,c2);
  let kmRoad=Math.round(km*1.28);
  lastKm=kmRoad;
  let hours=(kmRoad/70).toFixed(1);

  if(!tons){
    box.style.display='block'; bar.style.display='none';
    box.innerHTML=`📏 <b>${pu} → ${dr}</b><br>Distance: <b>${kmRoad} km</b> | Time: ${hours} hrs<br><span style="color:red">👉 Now select Tons</span>`;
    document.getElementById('status').innerText=`${kmRoad}km calculated - Select Tons`;
    return;
  }
  if(!tr){
    box.style.display='block'; bar.style.display='none';
    box.innerHTML=`📏 <b>${pu} → ${dr}</b> = <b>${kmRoad} km</b><br>⚖️ <b>${tons}T</b><br><span style="color:red">👉 Now tap a truck</span>`;
    document.getElementById('status').innerText=`${kmRoad}km | ${tons}T - Select Truck`;
    return;
  }
  if(tons>max){
    box.style.display='block'; bar.style.display='none';
    box.innerHTML=`⚠️ <b>${tr}</b> max is ${max}T but you selected ${tons}T`;
    return;
  }

  let weightFee=tons*0.12;
  let price=base + (kmRoad*rate) + weightFee;
  price=Math.round(price*100)/100;
  currentPrice=price; window.currentPrice=price;

  box.style.display='block'; bar.style.display='block';
  box.innerHTML=`📏 <b>${pu} → ${dr}</b><br>Distance: <b>${kmRoad} km</b> | ⏱️ ${hours} hrs<br>⚖️ Load: <b>${tons} Tons</b> | Truck: <b>${tr}</b><br><span class="price-big">💰 π ${price}</span><br><small>Base π${base} + Road π${(kmRoad*rate).toFixed(2)} + Weight π${weightFee.toFixed(2)}</small>`;
  document.getElementById('status').innerText=`✅ Price π ${price} ready - Login then Pay or Cancel`;
}

function cancelQuote(){
  document.getElementById('pickup').value=''; document.getElementById('drop').value='';
  document.getElementById('tons').value=''; document.getElementById('truck').value='';
  document.getElementById('truckRate').value=''; document.getElementById('truckBase').value=''; document.getElementById('truckMax').value='';
  if(selected) selected.classList.remove('selected'); selected=null;
  document.getElementById('distBox').style.display='none';
  document.getElementById('actionBar').style.display='none';
  currentPrice=0; window.currentPrice=0;
  document.getElementById('status').innerText='❌ Cancelled - Start new quote';
}

async function login(){
  let btn=document.getElementById('loginBtn');
  btn.innerText='Connecting... Please wait';
  document.getElementById('status').innerText='Connecting to Pi...';
  try{
    // non-blocking incomplete payment handler
    const onIncomplete = (payment) => {
      console.log("Incomplete:",payment);
      fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:payment.identifier,txid:payment.transaction.txid})}).then(r=>r.json()).then(j=>console.log(j));
    };
    const scopes=['username','payments'];
    const auth = await Pi.authenticate(scopes, onIncomplete);
    user=auth.user;
    btn.innerText='✅ Logged: '+user.username;
    document.getElementById('status').innerText='✅ Welcome '+user.username+' - You can now Pay π '+(currentPrice||'');
  }catch(e){
    console.error(e);
    document.getElementById('status').innerText='❌ Login failed: '+(e.message||e)+' - MUST open in Pi Browser App, not Chrome. Also ensure your domain is approved in Pi Developer Portal.';
    btn.innerText='🔐 Login with Pi - Tap to Retry';
  }
}

async function pay(){
  if(isPaying) return;
  let pu=document.getElementById('pickup').value.trim();
  let dr=document.getElementById('drop').value.trim();
  let tr=document.getElementById('truck').value;
  let tons=document.getElementById('tons').value;
  if(!pu||!dr||!tons||!tr){ alert('Finish: cities, tons, truck'); return; }
  if(!user){ alert('Tap Login with Pi first'); return; }
  if(!currentPrice){ alert('No price yet'); return; }

  isPaying=true;
  let btn=document.getElementById('payBtn');
  btn.innerText=`Paying π ${currentPrice}...`;
  document.getElementById('status').innerText='Creating payment...';

  try{
    Pi.createPayment({
      amount: currentPrice,
      memo: `${tons}T ${tr} ${pu}->${dr} ${lastKm}km`.slice(0,90),
      metadata:{pickup:pu,dropoff:dr,truck:tr,tons:tons,mode:mode,km:lastKm,price:currentPrice}
    },{
      onReadyForServerApproval: async (paymentId) => {
        document.getElementById('status').innerText='Approving...';
        try{
          let r=await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:paymentId})});
          let j=await r.json(); console.log('approve',j);
        }catch(e){ console.log(e); }
      },
      onReadyForServerCompletion: async (paymentId, txid) => {
        document.getElementById('status').innerText='Completing...';
        try{
          let r=await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:paymentId,txid:txid})});
          let j=await r.json(); console.log('complete',j);
          document.getElementById('status').innerText=`✅ Paid π ${currentPrice}! ${tons}T ${tr} booked ${pu}→${dr}`;
        }catch(e){ document.getElementById('status').innerText='Completed but server error: '+e; }
        isPaying=false; btn.innerText='💳 Pay with Pi';
      },
      onCancel: () => {
        document.getElementById('status').innerText='Payment cancelled - You can Pay again or Cancel quote';
        isPaying=false; btn.innerText='💳 Pay with Pi';
      },
      onError: (e) => {
        document.getElementById('status').innerText='Payment Error: '+e;
        isPaying=false; btn.innerText='💳 Pay with Pi';
      }
    });
  }catch(e){
    document.getElementById('status').innerText='Create payment failed: '+e.message;
    isPaying=false; btn.innerText='💳 Pay with Pi';
  }
}
document.getElementById('payBtn').onclick=pay;
</script>
</body>
</html>
