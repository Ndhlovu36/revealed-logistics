<!DOCTYPE html>
<html lang="en">
<head>

<title>Revealed Logistics | Pi Payments Only</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f0f4ff;color:#0a1931}
.header{background:#0a1931;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.logo{color:#ffcc00;font-weight:900}.btn{padding:8px 14px;border-radius:20px;border:none;font-weight:800;font-size:12px;cursor:pointer;text-decoration:none;display:inline-block}
.btn-yellow{background:#ffcc00;color:#0a1931}.btn-blue{background:#6a1bbf;color:#fff}.btn-pi{background:#6a1bbf;color:#fff;width:100%;padding:12px;font-size:14px}
.hero{background:linear-gradient(135deg,#0a1931,#6a1bbf);color:#fff;text-align:center;padding:55px 18px}
.hero span{color:#ffcc00}
.section{max-width:1200px;margin:auto;padding:24px 14px}
.fleet{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:900px){.fleet{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12);position:relative}
.card img{width:100%;height:170px;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;background:#ffcc00;font-size:10px;font-weight:900;padding:4px 9px;border-radius:20px}
.feature{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:800px){.feature{grid-template-columns:1fr 1fr 1fr}}
.box{background:#fff;border-radius:14px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.1)}
.inp{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:6px 0;font-size:13px}
.pi-box{border:2px solid #6a1bbf;background:#f8f0ff}
.footer{background:#0a1931;color:#fff;text-align:center;padding:24px;font-size:12px}
</style>
</head>

</div>
