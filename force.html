<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head><body style="font-family:Arial;padding:20px;text-align:center">
<h2 style="color:red">FIX FROZEN LOGIN</h2>
<p>Pending payment blocks login. Tap below to CANCEL it.</p>
<button id="btn" onclick="fix()" style="width:100%;padding:18px;background:red;color:#fff;font-weight:bold;border:none;border-radius:10px;font-size:16px">🔴 TAP TO CANCEL PENDING</button>
<div id="log" style="margin-top:20px;background:#eee;padding:15px;text-align:left;word-break:break-all"></div>
<script>
Pi.init({version:"2.0",sandbox:false});
function log(t){document.getElementById('log').innerText+=t+"\n";}
async function fix(){
  log("Authenticating...");
  try{
    const scopes=['username','payments'];
    function onIncomplete(p){
      log("Found pending: "+p.identifier+"\nCancelling...");
      fetch('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:p.identifier})})
      .then(r=>r.json()).then(d=>{
        log("Result: "+JSON.stringify(d)+"\n\nDONE! Close Pi Browser fully and reopen.");
      });
    }
    await Pi.authenticate(scopes,onIncomplete);
    log("Auth done - if no pending found, you are fixed - close browser!");
  }catch(e){log("Error: "+e.message);}
}
</script>
</body></html>
