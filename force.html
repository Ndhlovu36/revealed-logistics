<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORCE COMPLETE</title><script src="https://sdk.minepi.com/pi-sdk.js"></script></head><body style="font-family:Arial;padding:20px"><h1 style="color:green;text-align:center">COMPLETE PENDING</h1><button onclick="clearIt()" style="background:green;color:white;padding:25px;width:100%;font-size:24px;font-weight:bold;border-radius:15px;border:none">🟢 TAP TO COMPLETE</button><pre id="log" style="background:#eee;padding:15px;margin-top:20px;border:2px solid green;min-height:100px;white-space:pre-wrap">Ready. Open in Pi Browser and tap.</pre><script>async function clearIt(){const log=document.getElementById('log');try{if(typeof Pi==='undefined'){log.innerText='Open in Pi Browser only!';return;}Pi.init({version:"2.0",sandbox:false});log.innerText='Authenticating...';const onIncomplete=async(p)=>{log.innerText='Found: '+p.identifier+'\nCompleting...';const r=await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:p.identifier,txid:p.transaction.txid})});const j=await r.json();log.innerText='Result:\n'+JSON.stringify(j,null,2)+'\n\n✅ DONE! CLOSE Pi Browser now!';};await Pi.authenticate(['username','payments'],onIncomplete);log.innerText='No pending! Already cleared. Close Pi Browser.';}catch(e){log.innerText='Error: '+e.message;}}</script></body></html>
